    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');

        /* ============================================
           Apple Design tokens (skill: apple-design)
           ============================================ */
        :root {
            --spring-easing: cubic-bezier(0.22, 1, 0.36, 1);     /* critically damped feel */
            --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);  /* slight overshoot for momentum */
            --text-primary: #F3F4F6;
        }

        * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-optical-sizing: auto;  /* §15: optical sizing */
        }

        body {
            background-color: #0B0F19;
            color: #F3F4F6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            letter-spacing: -0.011em;  /* §15: body tracking */
        }

        /* §15: Typography — size-specific tracking & leading (Apple optical sizing) */
        h1, h2, h3 {
            letter-spacing: -0.02em;   /* tighten large text */
            font-weight: 700;
            font-optical-sizing: auto;
        }
        .text-xs, .text-[11px], .text-[10px] {
            letter-spacing: 0.01em;    /* small text wants slightly positive tracking */
        }
        .uppercase.tracking-widest, .uppercase.tracking-wider {
            letter-spacing: 0.08em;    /* captions stay airy */
        }

        /* ============================================
           §12: Materials & depth — translucency conveys hierarchy
           ============================================ */
        .glass-panel {
            background: rgba(22, 30, 49, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-color: rgba(255, 255, 255, 0.18);  /* bright top edge = light catching material */
            box-shadow:
                0 1px 0 0 rgba(255, 255, 255, 0.06) inset,
                0 8px 32px -8px rgba(0, 0, 0, 0.4);
        }

        .glass-panel-highlight {
            background: linear-gradient(135deg, rgba(0, 43, 122, 0.85) 0%, rgba(211, 17, 24, 0.75) 100%);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-top-color: rgba(255, 255, 255, 0.28);
            box-shadow:
                0 1px 0 0 rgba(255, 255, 255, 0.2) inset,
                0 8px 32px 0 rgba(0, 43, 122, 0.37);
        }

        .glass-nav {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 -1px 0 0 rgba(255, 255, 255, 0.06) inset,
                0 -8px 24px -4px rgba(0, 0, 0, 0.3);
        }

        /* §12: Vibrancy — text legible sobre backgrounds translúcidos */
        .glass-panel-highlight strong,
        .glass-panel-highlight span {
            font-weight: 500;
        }

        /* §12: Scroll edge effects instead of hard dividers */
        .scroll-fade-top {
            position: relative;
        }
        .scroll-fade-top::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 12px;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.6), transparent);
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================
           §1 & §10: Press feedback — respond on pointer-down, instant
           ============================================ */
        .pressable {
            transition: transform 0.4s var(--spring-easing);
            will-change: transform;
            cursor: pointer;
        }
        .pressable:active {
            transform: scale(0.97);
            transition: transform 100ms ease-out;
        }

        /* Bottom nav — Apple spring + scale on press (§1, §4, §10) */
        .nav-btn {
            transition: transform 0.4s var(--spring-easing), color 0.3s ease;
            will-change: transform;
        }
        .nav-btn:active {
            transform: scale(0.92);
            transition: transform 100ms ease-out;
        }
        .nav-btn.text-blue-400 svg {
            transform: scale(1.08);
            transition: transform 0.45s var(--spring-bounce);
        }

        /* ============================================
           §3 & §8: Tab content entrance — hint in direction of motion (spring)
           ============================================ */
        .tab-content {
            animation: tabEnter 0.5s var(--spring-easing) both;
        }
        @keyframes tabEnter {
            0%   { opacity: 0; transform: translateY(10px) scale(0.985); filter: blur(4px); }
            60%  { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .tab-content > * {
            animation: childEnter 0.5s var(--spring-easing) both;
            animation-delay: calc(var(--i, 0) * 50ms);
        }
        @keyframes childEnter {
            0%   { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* §4 & §5: Player markers — spring on formation change */
        .player-marker {
            transition: top 0.55s var(--spring-bounce), left 0.55s var(--spring-bounce), transform 0.4s var(--spring-easing);
            will-change: transform, top, left;
        }
        .player-marker:active { transform: scale(0.92); }

        /* Custom Scrollbar for Standings Table */
        .table-container::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .table-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        /* Hide Scrollbars in iOS Tab Views */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* §13: Soft pulse refinement (multimodal feedback — visual layer) */
        @keyframes softPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.55; }
        }
        .animate-pulse { animation: softPulse 2s ease-in-out infinite; }

        /* ============================================
           §14: Reduced motion & accessibility
           ============================================ */
        @media (prefers-reduced-motion: reduce) {
            .tab-content, .tab-content > *, .player-marker, .pressable, .nav-btn, .nav-btn svg, .animate-pulse {
                animation: none !important;
                transition: opacity 200ms ease !important;
                transform: none !important;
                filter: none !important;
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .glass-panel, .glass-nav, .glass-panel-highlight {
                background: rgba(20, 28, 46, 0.95) !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
        }
        @media (prefers-contrast: more) {
            .glass-panel, .glass-nav, .glass-panel-highlight {
                border-color: rgba(255, 255, 255, 0.35) !important;
            }
        }
    </style>

        // View Navigation Handler (with Apple spring feedback)
        function switchTab(tab) {
            if (tab === currentTab) return;
            currentTab = tab;

            const content = document.getElementById('app-content');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-400');
                btn.classList.add('text-gray-400');
            });

            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('text-blue-400');
            }

            if (tab === 'tabla') content.innerHTML = renderStandings();
            else if (tab === 'partidos') content.innerHTML = renderMatches();
            else if (tab === 'copas') content.innerHTML = renderCompeticiones();
            else if (tab === 'club') content.innerHTML = renderClub();

            // Apply staggered child indices for entrance animation
            const children = content.querySelectorAll('.tab-content > *');
            children.forEach((el, i) => {
                if (!el.style.getPropertyValue('--i')) el.style.setProperty('--i', i);
            });

            // Spring bounce on the active nav button (Apple §4 — momentum drives overshoot)
            if (window.Motion && activeBtn) {
                try {
                    window.Motion.animate(
                        activeBtn,
                        { transform: ['scale(1)', 'scale(0.92)', 'scale(1)'] },
                        { duration: 0.4, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
                    );
                } catch(e) { /* fail silently */ }
            }
        }

        // Cambia el sub-tab dentro de la vista Competiciones
        function setCompetition(comp) {
            if (comp === currentCompetition) return;
            currentCompetition = comp;
            const detail = document.getElementById('competition-content');
            if (detail) {
                detail.innerHTML = renderCompetitionDetail(comp);
                // Spring fade-in for the new detail
                if (window.Motion) {
                    try {
                        window.Motion.animate(
                            detail,
                            { opacity: [0, 1], transform: ['translateY(8px)', 'translateY(0)'] },
                            { duration: 0.45, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                        );
                    } catch(e) { /* fail silently */ }
                }
            }
            // Re-render to update the active state on sub-tab buttons
            document.getElementById('app-content').innerHTML = renderCompeticiones();
        }

        // ============================================================
        // Vista Club: sub-tabs para Plantel, Estadísticas y Mística.
        // Renombramos el tab "Estadísticas" → "Club" para que agrupe
        // todo lo institucional del club (jugadores, números, historia).

        function renderClub() {
            const sections = [

            if (section === 'estadisticas') return renderEstadisticas();

        function setClubSection(section) {
            if (section === currentClubSection) return;
            currentClubSection = section;
            const detail = document.getElementById('club-content');
            if (detail) {
                detail.innerHTML = renderClubSection(section);

        // ============================================================
        // Carga dinámica de datos desde data.json (generado por el
        // scraper Python + GitHub Action). Si fetch falla (ej: abriendo
        // el archivo local con file://) o el JSON tiene estructura
        // incorrecta, usa FALLBACK_DATA.
        // ============================================================
        async function loadData() {
            try {
                const res = await fetch('data.json', { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const parsed = await res.json();
                // Validar estructura mínima
                if (!parsed || !parsed.liga || !Array.isArray(parsed.liga.standings) || !parsed.liga.standings.length) {
                    console.warn('[Mi UChile] data.json no tiene estructura esperada — usando FALLBACK_DATA. Recibido:', parsed);
                    throw new Error('Estructura de data.json inválida (falta liga.standings)');
                }
                appData = parsed;
                console.log('[Mi UChile] ✓ Datos cargados desde data.json', appData.meta);
            } catch (err) {
                console.warn('[Mi UChile] Usando datos de fallback:', err.message);
                appData = null;  // getData() usará FALLBACK_DATA
            }
        }

        // ============================================================
        // Inicialización — usa DOMContentLoaded (no espera a `load`)
        // para no depender de que el CDN de Motion cargue. Si el
        // documento ya está parsed, ejecuta inmediatamente.
        // ============================================================
        async function initApp() {
            try {
                await loadData();
                switchTab('tabla');
            } catch (err) {
                console.error('[Mi UChile] Error al inicializar:', err);
                // Mostrar mensaje de error visible en lugar de pantalla en blanco
                document.getElementById('app-content').innerHTML = `
                    <div class="glass-panel p-6 rounded-3xl text-center space-y-3">
                        <div class="text-red-400 text-4xl">⚠</div>
                        <h2 class="text-lg font-bold text-white">No se pudo cargar la app</h2>
                        <p class="text-xs text-gray-400">Error: ${err.message || 'desconocido'}</p>
                        <p class="text-xs text-gray-500 mt-4">Abre la consola (F12) para más detalles, o recarga la página.</p>
                        <button onclick="location.reload()" class="pressable mt-4 px-4 py-2 rounded-xl bg-uchile-blue text-white text-sm font-bold border border-uchile-gold">Recargar</button>
                    </div>
                `;
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            // El DOM ya está listo (script está al final del body)
            initApp();
        }
    </script>
</body>
</html>
