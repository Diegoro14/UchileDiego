    <!-- Nombre de la app en iOS / Android (cuando se agrega a pantalla de inicio) -->
    <meta name="apple-mobile-web-app-title" content="U. de Chile">
    <meta name="application-name" content="U. de Chile">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0B0F19">
    <script>
    /* Tema (claro/oscuro/auto) y tamaño de letra: se aplican antes de pintar para evitar parpadeos */
    (function () {
        var root = document.documentElement;
        function g(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
        window.applyTheme = function (mode) {
            var m = mode || g('uch-theme', 'dark');
            var light = m === 'light' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
            root.classList.toggle('light', light);
            root.classList.toggle('dark', !light);
            var tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.setAttribute('content', light ? '#002B7A' : '#0B0F19');
        };
        window.applyFontScale = function (p) {
            var v = parseFloat(p);
            if (!isFinite(v)) v = parseFloat(g('uch-fs', '100'));
            if (!isFinite(v)) v = 100;
            v = Math.max(85, Math.min(140, v));
            root.style.fontSize = (16 * v / 100) + 'px';
            return v;
        };
        window.applyTopExtra = function (p) {
            var v = parseFloat(p);
            if (!isFinite(v)) v = parseFloat(g('uch-top', '28'));
            if (!isFinite(v)) v = 28;
            v = Math.max(0, Math.min(60, v));
            root.style.setProperty('--top-extra', v + 'px');
            return v;
        };
        window.applyTheme(); window.applyFontScale(); window.applyTopExtra();
        if (window.matchMedia) {
            var mq = matchMedia('(prefers-color-scheme: light)');
            var h = function () { if (g('uch-theme', 'dark') === 'auto') window.applyTheme(); };
            if (mq.addEventListener) mq.addEventListener('change', h);
        }
    })();
    </script>

        /* §15: Typography — size-specific tracking & leading (Apple optical sizing) */
        h1, h2, h3 {
            letter-spacing: -0.02em;   /* tighten large text */
            font-weight: 700;
            font-optical-sizing: auto;
        }
        .text-xs, .text-[11px], .text-[10px] {
            letter-spacing: 0.01em;    /* small text wants slightly positive tracking */
        }
        .uppercase.tracking-widest, .uppercase.tracking-wider {
            letter-spacing: 0.08em;    /* captions stay airy */
        }

        /* ============================================
           §12: Materials & depth — translucency conveys hierarchy
           ============================================ */
        .glass-panel {
            background: rgba(22, 30, 49, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-color: rgba(255, 255, 255, 0.18);  /* bright top edge = light catching material */
            box-shadow:
                0 1px 0 0 rgba(255, 255, 255, 0.06) inset,
                0 8px 32px -8px rgba(0, 0, 0, 0.4);
        }

        .glass-panel-highlight {
            background: linear-gradient(135deg, rgba(0, 43, 122, 0.85) 0%, rgba(211, 17, 24, 0.75) 100%);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-top-color: rgba(255, 255, 255, 0.28);
            box-shadow:
                0 1px 0 0 rgba(255, 255, 255, 0.2) inset,
                0 8px 32px 0 rgba(0, 43, 122, 0.37);
        }


        /* §12: Vibrancy — text legible sobre backgrounds translúcidos */
        .glass-panel-highlight strong,
        .glass-panel-highlight span {
            font-weight: 500;
        }

        /* §12: Scroll edge effects instead of hard dividers */
        .scroll-fade-top {
            position: relative;
        }
        .scroll-fade-top::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 12px;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.6), transparent);
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================
           §1 & §10: Press feedback — respond on pointer-down, instant
           ============================================ */
        input, textarea { user-select: text; -webkit-user-select: text; font-size: 16px; }
        .pressable {
            transition: transform 0.4s var(--spring-easing);
            will-change: transform;
            cursor: pointer;
        }
        .pressable:active {
            transform: scale(0.97);
            transition: transform 100ms ease-out;
        }


        /* ============================================
           §3 & §8: Tab content entrance — hint in direction of motion (spring)
           ============================================ */
        .tab-content {
            animation: tabEnter 0.5s var(--spring-easing) both;
        }
        @keyframes tabEnter {
            0%   { opacity: 0; transform: translateY(10px) scale(0.985); filter: blur(4px); }
            60%  { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .tab-content > * {
            animation: childEnter 0.5s var(--spring-easing) both;
            animation-delay: calc(var(--i, 0) * 50ms);
        }
        @keyframes childEnter {
            0%   { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* §4 & §5: Player markers — spring on formation change */
        .player-marker {
            transition: top 0.55s var(--spring-bounce), left 0.55s var(--spring-bounce), transform 0.4s var(--spring-easing);
            will-change: transform, top, left;
        }
        .player-marker:active { transform: scale(0.92); }

        /* Custom Scrollbar for Standings Table */
        .table-container::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .table-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        /* Hide Scrollbars in iOS Tab Views */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* §13: Soft pulse refinement (multimodal feedback — visual layer) */
        @keyframes softPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.55; }
        }
        .animate-pulse { animation: softPulse 2s ease-in-out infinite; }

        /* ============================================
           §14: Reduced motion & accessibility
           ============================================ */
        @media (prefers-reduced-motion: reduce) {
            .tab-content, .tab-content > *, .player-marker, .pressable, .nav-btn, .nav-btn svg, .animate-pulse {
                animation: none !important;
                transition: opacity 200ms ease !important;
                transform: none !important;
                filter: none !important;
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .glass-panel, .glass-nav, .glass-panel-highlight {
                background: rgba(20, 28, 46, 0.95) !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
        }
        @media (prefers-contrast: more) {
            .glass-panel, .glass-nav, .glass-panel-highlight {
                border-color: rgba(255, 255, 255, 0.35) !important;
            }
        }

        /* ============================================
           Tema, áreas seguras y tamaño de letra
           ============================================ */
        :root { --label2: #6b7280; --tint: #0A60FF; --card: #ffffff; }
        html.dark { --label2: #98a2b3; --tint: #60A5FA; --card: #161e31; }
        html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
        html.light { color-scheme: light; }
        body { padding-bottom: calc(8rem + env(safe-area-inset-bottom)); }
        /* La cabecera ahora respeta la isla / barra de estado del iPhone */
        #app-header { padding-top: calc(env(safe-area-inset-top) + var(--top-extra, 28px)); }
        /* Los textos en px de Tailwind también escalan con el tamaño de letra */
        .text-\[10px\] { font-size: .625rem !important; }
        .text-\[11px\] { font-size: .6875rem !important; }
        .standings-table td, .standings-table th { overflow: hidden; }

        /* ============================================
           Modo claro
           ============================================ */
        html.light body { background: transparent !important; color: #111827 !important; }
        html.light .glass-panel {
            background: rgba(255,255,255,.74);
            border: 1px solid rgba(0,0,0,.06);

        /* ───────── Tab bar · Liquid Glass v3 ───────── */
        :root {
            --lg-glass: rgba(255,255,255,.34); --lg-blur: 2px; --lg-txt-shadow: rgba(0,0,0,.2); --lg-ink: var(--tint); --lg-edge: rgba(0,0,0,.10);
            --lg-sink: rgba(0,0,0,.10); --lg-sink2: rgba(0,0,0,.06); --lg-vig: rgba(0,0,0,.05); --lg-cast: rgba(0,0,0,.18);
            --lg-blend: normal; --lg-ca-op: .6; --lg-line: rgba(0,0,0,.35);
            --lg-flat: rgba(0,0,0,.09); --lg-fg: #0b0b0f;
        }
        html.dark {
            --lg-glass: rgba(40,40,44,.26); --lg-txt-shadow: rgba(0,0,0,.45); --lg-ink: var(--tint); --lg-edge: rgba(255,255,255,.14);
            --lg-sink: rgba(0,0,0,.4); --lg-sink2: rgba(0,0,0,.28); --lg-vig: rgba(0,0,0,.16); --lg-cast: rgba(0,0,0,.4);
            --lg-blend: screen; --lg-ca-op: 1; --lg-line: rgba(0,0,0,.6);
            --lg-flat: rgba(0,0,0,.5); --lg-fg: #ffffff;
        }
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0 .875rem calc(env(safe-area-inset-bottom) + .5rem); pointer-events: none; }
        .lg-bar {
            position: relative; pointer-events: auto; max-width: 28rem; margin: 0 auto; height: 4.125rem; border-radius: 99px;
            will-change: transform; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
        }
        .lg-bg, .lg-cast, .lg-edge { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
        /* Transparencia tipo WhatsApp: poco desenfoque, el contenido de atrás se ve */
        .lg-bg { background: var(--lg-glass); -webkit-backdrop-filter: blur(var(--lg-blur, 2px)) saturate(1.6); backdrop-filter: blur(var(--lg-blur, 2px)) saturate(1.6); }
        /* Halo NEGRO suave para leer las letras sobre el contenido (nunca blanco) */
        .tabbar .lg-tabs, .lg-bar .lg-tabs { text-shadow: 0 0 6px var(--lg-txt-shadow); }
        .lg-cast { box-shadow: 0 10px 30px var(--lg-cast); }
        .lg-edge { width: 100%; height: 100%; overflow: visible; }
        .tabbar button img, .lg-tab img { height: 1.6rem; width: 1.6rem; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
        .lg-edge polygon { fill: none; stroke: var(--lg-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
        .lg-tabs { position: absolute; left: 0; top: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px; }
        .tabbar button, .lg-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .125rem; padding: .375rem 0; color: var(--lg-fg, var(--label2)); font-size: .6875rem; font-weight: 500; letter-spacing: .02em; border-radius: 2rem; }
        /* OJO: font-family, NO "font: inherit" (pisaría el font-size de arriba) */
        .tabbar button { transition: transform 120ms ease-out; background: none; border: 0; font-family: inherit; cursor: pointer; }
        .tabbar button i, .tabbar button svg, .lg-tab i, .lg-tab svg { font-size: 1.3125rem; height: 1.5rem; }
        .lg-tab { pointer-events: none; }
        .lg-main .lg-tab { color: var(--lg-ink); }
        .lg-r .lg-tab { color: #ff2a45; }
        .lg-b .lg-tab { color: #2a8bff; }
        .lg-r, .lg-b { mix-blend-mode: var(--lg-blend); opacity: var(--lg-ca-op); transition: opacity .22s ease; }
        /* Lente: SIN backdrop-filter (vidrio claro, no esmerilado) */
        .lg-lens {
            position: absolute; left: 0; top: 4px; will-change: transform; transition: box-shadow .22s ease, background-color .22s ease;
            background: radial-gradient(closest-side at 50% 50%, rgba(255,255,255,.03) 55%, var(--lg-vig) 100%);
            box-shadow:
                inset 0 6px 9px -5px var(--lg-sink),
                inset 0 -6px 8px -5px var(--lg-sink2),
                inset 2px 0 2px -1px rgba(255,90,80,.16),
                inset -2px 0 2px -1px rgba(80,150,255,.2),
                inset 0 0 0 1px rgba(255,255,255,.05),
                inset 0 1px 0 rgba(255,255,255,.12),
                inset 0 -1px 0 rgba(255,255,255,.06),
                0 0 0 .5px var(--lg-line),
                0 3px 12px var(--lg-cast);
        }
        .lg-lens::after { content: ""; position: absolute; left: 26%; right: 26%; top: 1px; height: 2px; border-radius: 2px; opacity: .22;
            background: linear-gradient(90deg, rgba(120,200,255,0), rgba(255,255,255,.95) 30%, rgba(255,255,255,.95) 70%, rgba(255,120,120,0)); filter: blur(.6px); pointer-events: none; }
        .lg-lens::before { content: ""; position: absolute; left: 30%; right: 30%; bottom: 1px; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.3), rgba(255,255,255,0)); pointer-events: none; }
        /* Reposo (como iOS): cápsula plana; al tocar se vuelve burbuja de cristal */
        .lg-lens.lg-flat { background: var(--lg-flat); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
        .lg-lens.lg-flat::before, .lg-lens.lg-flat::after { display: none; }
        .lg-lens.lg-flat .lg-r, .lg-lens.lg-flat .lg-b { opacity: 0; }
        .lg-lens.lg-flat .lg-glare, .lg-lens.lg-flat .lg-rim { opacity: 0 !important; }
        .lg-clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; isolation: isolate; }
        .lg-clone { position: absolute; left: 0; top: 0; pointer-events: none; }
        .lg-glare { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: var(--lg-blend); opacity: 0;
            background: radial-gradient(circle at var(--gx, 30%) var(--gy, 12%), rgba(255,255,255,.8) 0, rgba(190,225,255,.4) 16%, rgba(255,255,255,0) 52%); }
        .lg-rim { position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; opacity: .8; filter: blur(.4px);
            /* Iridiscencia solo en las tapas de arriba y abajo (como en iOS); los costados quedan con el borde fino */
            background: conic-gradient(from calc(var(--ang, -30deg) * .25),
                rgba(110,230,170,0) 318deg, rgba(110,230,170,.4) 336deg, rgba(95,170,255,.48) 353deg, rgba(175,120,255,.42) 8deg, rgba(255,110,140,.3) 24deg, rgba(255,110,140,0) 42deg,
                rgba(255,110,140,0) 138deg, rgba(255,110,140,.28) 155deg, rgba(175,120,255,.38) 174deg, rgba(95,170,255,.42) 191deg, rgba(110,230,170,.36) 208deg, rgba(110,230,170,0) 226deg);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
        .lg-range { width: 100%; accent-color: var(--tint); margin: 0; height: 1.75rem; }
        @media (prefers-reduced-transparency: reduce) { .lg-bg { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; } }
        /* Ajustes · paneles colapsables */
        details.aj-panel > summary { list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        details.aj-panel > summary::-webkit-details-marker { display: none; }
        .aj-chev { transition: transform .3s cubic-bezier(.22, 1, .36, 1); }
        details.aj-panel[open] .aj-chev { transform: rotate(180deg); }
        details.aj-panel[open] > summary { border-bottom: 1px solid rgba(255,255,255,.07); }
        html.light details.aj-panel[open] > summary { border-bottom-color: rgba(0,0,0,.07); }
        /* Partido en vivo: pulso rojo del badge y celebración de gol */
        @keyframes uch-pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, .55); }
            50% { box-shadow: 0 0 0 7px rgba(248, 113, 113, 0); }
        }
        .uch-live-dot { animation: uch-pulse-red 1.6s ease-out infinite; }
        @keyframes uch-gol-pop {
            0% { transform: scale(.8); opacity: 0; }
            30% { transform: scale(1.05); opacity: 1; }
            55% { transform: scale(.98); }
            100% { transform: scale(1); opacity: 1; }
        }
        .uch-gol { animation: uch-gol-pop .7s cubic-bezier(.22, 1, .36, 1) both; }

    <script>
    /* Liquid Glass tab bar v3: cápsula plana en reposo, burbuja de cristal angosta al tocar */
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var bg = $('lg-bg'), edgeP = $('lg-edge-p'), lastShape = '';
        var bar = $('lg-bar'), base = $('lg-base'), lens = $('lg-lens'), clone = $('lg-clone');
        var chR = $('lg-r'), chB = $('lg-bl'), main = $('lg-main'), glare = $('lg-glare'), rim = $('lg-rim');
        var btns = base.querySelectorAll('button');
        var IDS = Array.prototype.map.call(btns, function (b) { return b.id.replace('tab-btn-', ''); });
        var N = IDS.length;
        var html = Array.prototype.map.call(btns, function (b) { return '<span class="lg-tab">' + b.innerHTML + '</span>'; }).join('');
        [chR, chB, main].forEach(function (c) { c.innerHTML = html; });
        var layerTabs = [chR, chB, main].map(function (c) { return c.querySelectorAll('.lg-tab'); });
        [base, chR, chB, main].forEach(function (c) { c.style.gridTemplateColumns = 'repeat(' + N + ', 1fr)'; });

        function ld(k, d) { try { var v = parseFloat(localStorage.getItem(k)); return isFinite(v) ? v : d; } catch (e) { return d; } }
        function sv(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
        var DEF = { mag: 1.3, dis: 1, glr: 1, wet: 1 };
        var mag = ld('gp-lg-mag', DEF.mag), dis = ld('gp-lg-dis', DEF.dis), glr = ld('gp-lg-glr', DEF.glr), wet = ld('gp-lg-wet', DEF.wet);
        var clip = lens.querySelector('.lg-clip'), lgDisp = $('lg-disp'), lgTurb = $('lg-turb');

        /* LW = ancho de la gota (angosta, centrada en su pestaña); tabW = ancho de cada pestaña */
        var W = 0, H = 0, tabW = 0, LW = 0, lensH = 0, PAD = 4, LENS_MAX = 78;
        var current = 0, x = 0, vx = 0, target = 0, grow = 0, vg = 0, growTarget = 0, dragging = false, raf = 0, last = 0;
        var flash = 0, gx = 0.3, gy = 0.15, wetApplied = null, lastTurb = 0, lastPx = 0, downAt = 0, lastMoveAt = 0;
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var K = 240, C = reduce ? 40 : 21;

        function xFor(i) { return PAD + i * tabW + (tabW - LW) / 2; }
        function measure() {
            W = bar.clientWidth; H = bar.clientHeight;
            if (!W) return;
            tabW = (W - PAD * 2) / N; LW = Math.min(tabW, LENS_MAX); lensH = H - PAD * 2;
            [base, chR, chB, main].forEach(function (t) { t.style.width = W + 'px'; t.style.height = H + 'px'; });
            lens.style.width = LW + 'px'; lens.style.height = lensH + 'px'; lens.style.borderRadius = (lensH / 2) + 'px';
            clone.style.width = W + 'px'; clone.style.height = H + 'px';
            if (!dragging) { x = target = xFor(current); }
        }
        function localX(e) { var r = bar.getBoundingClientRect(); return (e.clientX - r.left) * (W / (r.width || 1)); }
        function clampX(px) { return Math.max(xFor(0), Math.min(xFor(N - 1), px)); }
        function indexAt(px) { return Math.max(0, Math.min(N - 1, Math.floor((px - PAD) / tabW))); }

        /* El vidrio de la barra se hunde (arriba y abajo) solo bajo la burbuja; los hombros terminan dentro de ella */
        function shapeBar() {
            if (!W || !H) return;
            var pinch = Math.max(0, Math.min(1.1, grow)) * H * 0.09;
            var lh = LW * (1 + grow * 0.24) / 2, flatH = lh * 0.42, TR = Math.max(8, lh * 0.3);
            var cx = x + LW / 2, R = H / 2, k, th, px, h, dd, b, o;
            var xs = [];
            for (k = 0; k <= 16; k++) { th = (Math.PI / 2) * k / 16; xs.push(R - R * Math.cos(th)); }
            for (px = R + 3; px < W - R - 1; px += 3) xs.push(px);
            for (k = 0; k <= 16; k++) { th = (Math.PI / 2) * k / 16; xs.push(W - R + R * Math.sin(th)); }
            var P = [], Q = [];
            xs.forEach(function (X) {
                h = X < R ? Math.sqrt(Math.max(0, R * R - (R - X) * (R - X))) : X > W - R ? Math.sqrt(Math.max(0, R * R - (X - (W - R)) * (X - (W - R)))) : R;

            var cp = 'polygon(' + all.map(function (q) { return q[0].toFixed(1) + 'px ' + q[1].toFixed(1) + 'px'; }).join(',') + ')';

        function render() {
            if (!W) return;
            var stretch = Math.min(Math.abs(vx) / 2600, 0.28);
            var sx = (1 + grow * 0.24) * (1 + stretch), sy = (1 + grow * 0.23) * (1 - stretch * 0.4);
            lens.style.transform = 'translate3d(' + x + 'px,0,0) scale(' + sx + ',' + sy + ')';
            bar.style.transform = 'scale(' + (1 + grow * 0.04) + ')';
            shapeBar();
            var ca = dis * (0.3 + grow * 0.5 + Math.min(Math.abs(vx) / 2200, 1.1));
            chR.style.transform = 'translate(' + (-ca) + 'px,' + (-ca * 0.35) + 'px)';
            chB.style.transform = 'translate(' + ca + 'px,' + (ca * 0.35) + 'px)';
            glare.style.setProperty('--gx', (gx * 100) + '%'); glare.style.setProperty('--gy', (gy * 100) + '%');
            glare.style.opacity = String(Math.min(1, glr * (0.12 + grow * 0.5 + flash * 0.8)));
            rim.style.setProperty('--ang', (-35 + (x / Math.max(W, 1)) * 70) + 'deg');
            rim.style.opacity = String(Math.min(0.85, 0.4 + glr * 0.15 + grow * 0.25));
            /* Lupa solo con dedo: en reposo el ícono está a 1x */
            var gm = Math.max(0, Math.min(1, grow * 1.4)); var s = (1 + (mag - 1) * gm) * (1 + grow * 0.1);
            clone.style.transformOrigin = (LW / 2) + 'px ' + (lensH / 2) + 'px';
            clone.style.transform = 'scale(' + (1 / sx) + ',' + (1 / sy) + ') translate(' + (-x) + 'px,' + (-PAD) + 'px)';
            /* Íconos base se desvanecen solo bajo la gota; la lente los pinta. Borde casi de corte limpio en reposo (sin negro en las orillas del texto), suave solo al arrastrar */

            var mk = 'linear-gradient(90deg,#000 0,#000 ' + (cx - half) + 'px,transparent ' + (cx - inn) + 'px,transparent ' + (cx + inn) + 'px,#000 ' + (cx + half) + 'px,#000 100%)';
            base.style.webkitMaskImage = mk; base.style.maskImage = mk;
            var tk = 'linear-gradient(90deg,transparent 0,transparent ' + (cx - half) + 'px,#000 ' + (cx - inn) + 'px,#000 ' + (cx + inn) + 'px,transparent ' + (cx + half) + 'px,transparent 100%)';
            clone.style.webkitMaskImage = tk; clone.style.maskImage = tk;
            /* Lupa: cada ícono crece sobre su propio centro según cuánto lo cubre la gota */
            for (var li = 0; li < N; li++) {
                var dd = Math.abs(cx - (xFor(li) + LW / 2)) / tabW;
                var w = Math.max(0, 1 - dd / 0.85); w = w * w * (3 - 2 * w);
                var kk = 'scale(' + (1 + (s - 1) * w).toFixed(4) + ')';
                for (var ly = 0; ly < 3; ly++) layerTabs[ly][li].style.transform = kk;
            }
            /* Distorsión de agua: el filtro solo está puesto mientras hay movimiento */
            var sc = wet > 0 ? wet * (2 + grow * 7 + Math.min(Math.abs(vx) / 220, 6)) : 0;
            lgDisp.setAttribute('scale', sc.toFixed(2));
            var wetOn = wet > 0 && sc > 0.35;
            if (wetOn !== wetApplied) { wetApplied = wetOn; clip.style.filter = wetOn ? 'url(#lg-wet)' : 'none'; }
            var nowT = performance.now();
            if (wetOn && nowT - lastTurb > 90) {
                lastTurb = nowT; var tt = nowT / 900;
                lgTurb.setAttribute('baseFrequency', (0.018 + 0.004 * Math.sin(tt)).toFixed(4) + ' ' + (0.045 + 0.008 * Math.cos(tt * 1.3)).toFixed(4));
            }
        }
        function step(t) {
            var dt = Math.min((t - last) / 1000 || 0.016, 0.034); last = t;
            var ax = -K * (x - target) - C * vx; vx += ax * dt; x += vx * dt;
            var ag = -300 * (grow - growTarget) - 24 * vg; vg += ag * dt; grow += vg * dt;
            flash *= Math.exp(-dt * 4.5);
            try { render(); } catch (err) { /* un error de dibujo no debe congelar la barra */ }
            var still = Math.abs(vx) < 0.5 && Math.abs(x - target) < 0.1 && Math.abs(vg) < 0.01 && Math.abs(grow - growTarget) < 0.002 && flash < 0.01;
            if (still && !dragging) { x = target; grow = growTarget; vx = 0; vg = 0; render(); raf = 0; return; }
            raf = requestAnimationFrame(step);
        }
        function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } }

        /* switchTab() llama a esto para que la gota siga a la pestaña activa */
        window.lgSetTab = function (name) {
            var i = IDS.indexOf(name); if (i < 0) return;
            current = i; if (!dragging) { target = xFor(i); kick(); }
        };

        function updateGlare(e) {
            var r = bar.getBoundingClientRect();
            var px = localX(e), py = (e.clientY - r.top) * (H / (r.height || 1));
            gx = Math.max(0.05, Math.min(0.95, (px - x) / LW));
            gy = Math.max(0.05, Math.min(0.6, (py - PAD) / lensH));
        }
        bar.addEventListener('pointerdown', function (e) {
            dragging = true;
            if (raf) { cancelAnimationFrame(raf); raf = 0; }
            try { bar.setPointerCapture(e.pointerId); } catch (err) {}
            lens.classList.remove('lg-flat');
            lastPx = localX(e); downAt = Date.now(); lastMoveAt = downAt;
            growTarget = 1; flash = 1; target = clampX(lastPx - LW / 2);
            updateGlare(e); kick();
        });
        bar.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            lastPx = localX(e); lastMoveAt = Date.now();
            target = clampX(lastPx - LW / 2);
            updateGlare(e); kick();
        });
        function release(e) {
            if (!dragging) return;
            dragging = false; growTarget = 0; gx = 0.3; gy = 0.15;
            lens.classList.add('lg-flat');
            var onBar = e && (e.type === 'pointerup' || e.type === 'pointercancel') && e.target && bar.contains(e.target);
            var i = indexAt(clampX((onBar ? localX(e) : lastPx) - LW / 2) + LW / 2);
            target = xFor(i);
            var changed = i !== current;
            current = i; kick();
            /* El contenido pesado se dibuja después de que la gota ya arrancó, para no trabar la animación */
            if (changed && typeof switchTab === 'function') {
                requestAnimationFrame(function () { setTimeout(function () { if (current === i) switchTab(IDS[i]); }, 90); });
            }
        }
        bar.addEventListener('pointerup', release);
        bar.addEventListener('pointercancel', release);
        /* Si iOS pierde el "soltar" (por ejemplo al empezar un scroll), la gota quedaba agarrada: se suelta igual */
        bar.addEventListener('lostpointercapture', release);
        document.addEventListener('pointerup', release);
        document.addEventListener('pointercancel', release);
        document.addEventListener('touchend', release, { passive: true });
        document.addEventListener('touchcancel', release, { passive: true });
        window.addEventListener('blur', release);
        document.addEventListener('visibilitychange', function () { if (document.hidden) release(); });
        /* Red de seguridad: si sigue agarrada sin que el dedo se mueva por más de 2 s, se suelta */
        setInterval(function () { if (dragging && Date.now() - downAt > 2000 && Date.now() - lastMoveAt > 2000) release(); }, 500);

        measure(); render();
        if (window.ResizeObserver) new ResizeObserver(function () { measure(); render(); }).observe(bar);
        window.addEventListener('resize', function () { measure(); render(); });

        /* Controles en la pantalla de Ajustes */
        function bindSettings() {
            var defs = [['mag', 'gp-lg-mag'], ['dis', 'gp-lg-dis'], ['glr', 'gp-lg-glr'], ['wet', 'gp-lg-wet']];
            function cur(k) { return k === 'mag' ? mag : k === 'dis' ? dis : k === 'glr' ? glr : wet; }
            function put(k, v) { if (k === 'mag') mag = v; else if (k === 'dis') dis = v; else if (k === 'glr') glr = v; else wet = v; }
            function show(k) { var el = $('lg-' + k), o = $('lg-' + k + '-out'); if (el) el.value = cur(k); if (o) o.textContent = cur(k).toFixed(2) + '×'; }
            defs.forEach(function (d) {
                var k = d[0], el = $('lg-' + k); if (!el) return;
                show(k);
                el.addEventListener('input', function (e) {
                    put(k, parseFloat(e.target.value)); sv(d[1], cur(k)); show(k);
                    if (k === 'glr') flash = 1;
                    render(); kick();
                });
            });
            var rs = $('lg-reset');
            if (rs) rs.addEventListener('click', function () {
                defs.forEach(function (d) { put(d[0], DEF[d[0]]); sv(d[1], DEF[d[0]]); show(d[0]); });
                flash = 1; render(); kick();
            });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindSettings); else bindSettings();
        /* Si la pantalla de Ajustes se redibuja, la app debe llamar a lgBindSettings() de nuevo */
        window.lgBindSettings = bindSettings;
    })();
    </script>

                    <div class="glass-panel p-4 rounded-3xl space-y-3" style="--i:1">

        function renderRoster() {
            return `

                    ${rosterData.map((cat, idx) => `
                        <div class="glass-panel p-4 rounded-3xl space-y-3" style="--i:${idx + 1}">

        // ============================================================
        // Vista Competiciones: sub-tabs para Pre-Libertadores,
        // Copa Libertadores, Copa Sudamericana y Supercopa de Chile
        // ============================================================
        function renderCompeticiones() {
            const comps = getData().competiciones;
            const tabs = [
                { id: 'prelibertadores', label: 'Pre-Libertadores' },
                { id: 'libertadores',    label: 'Copa Libertadores' },
                { id: 'sudamericana',    label: 'Copa Sudamericana' },
                { id: 'supercopa',       label: 'Supercopa Chile' }
            ];
            return `
                <div class="tab-content space-y-4">
                    <div class="glass-panel p-4 rounded-3xl" style="--i:0">
                        <span class="text-xs uppercase tracking-widest text-blue-400 font-semibold">Competiciones 2026</span>
                        <h2 class="text-xl font-bold text-white mt-1">Copas Nacionales e Internacionales</h2>
                    </div>

                    <!-- Sub-tab selector (scroll horizontal Apple-style) -->
                    <div class="glass-panel p-2 rounded-2xl" style="--i:1">
                        <div class="flex gap-1 overflow-x-auto no-scrollbar">
                            ${tabs.map(t => `
                                <button onclick="setCompetition('${t.id}')" class="pressable flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${currentCompetition === t.id ? 'bg-uchile-blue text-white border border-uchile-gold shadow-md' : 'text-gray-400 border border-transparent'}">

                                </button>

                    <div id="competition-content" style="--i:2">
                        ${renderCompetitionDetail(currentCompetition)}
                    </div>
                </div>
            `;
        }

        function renderCompetitionDetail(comp) {
            const c = getData().competiciones[comp];
            if (!c) return '';
            // Render específico para cada tipo de torneo
            if (comp === 'prelibertadores') return renderPreLibertadores(c);
            if (comp === 'libertadores')    return renderLibertadores(c);
            if (comp === 'sudamericana')    return renderSudamericana(c);
            if (comp === 'supercopa')       return renderSupercopa(c);
            return '';
        }

        function renderTeamChip(name, code, motivo, sizeClass = 'w-9 h-9') {
            return `
                <div class="flex items-center space-x-3 p-2.5 rounded-2xl bg-slate-800/40 border border-white/5">
                    <div class="${sizeClass} flex items-center justify-center shrink-0">
                        <img src="${logoFor(code)}" alt="${name}" class="${sizeClass} object-contain" onerror="this.style.display='none'"/>

                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm text-gray-100 truncate">${name}</p>
                        <p class="text-[10px] text-gray-400 truncate">${motivo}</p>
                    </div>
                </div>
            `;
        }

        function renderFixtureRow(f) {
            const jugado = f.jugado !== false && f.hScore !== null;
            const score = jugado

            return `
                <div class="pressable flex items-center justify-between p-3 rounded-2xl bg-slate-800/50 border border-white/5">
                    <span class="text-xs text-gray-400 w-24 truncate">${f.fecha}</span>

                        <span class="px-2.5 py-0.5 rounded-lg bg-black/40 font-mono font-bold text-sm border border-white/10 ${jugado ? 'text-emerald-400' : 'text-gray-500'}">${score}</span>
                        <span class="text-xs font-semibold text-gray-300 truncate max-w-[80px]">${f.away}</span>

        function renderSupercopa(c) {

        // ============================================================
        // Vista Estadísticas: goleadores, asistencias, vallas invictas

        function renderEstadisticas() {

                        title: 'Vallas Invictas',
                        icon: '🧤',
                        headers: ['Pos', 'Portero', 'Equipo', 'Vallas', 'PJ'],

        // ============================================================
        // Cánticos de Los de Abajo: lista clickeable con letra completa.
        // Las letras las agregas tú (se guardan en este teléfono).
        // ============================================================
        const CHANTS_KEY = 'uch-chants';
        let chantOpen = null;      // id del cántico abierto
        let chantEdit = null;      // id en edición, o 'new'
        function loadChants() {
            try {
                const v = JSON.parse(localStorage.getItem(CHANTS_KEY));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return [
                { id: 'c1', title: 'El Himno de la U', text: 'Mágica azul, tu estrella es la luz que guía a la victoria... ¡Universidad de Chile!' },
                { id: 'c2', title: 'Te Sigo a Todas Partes', text: 'No importa en qué cancha jugues, a la U la sigo a todas partes con el corazón...' }
            ];
        }
        function saveChants(list) { try { localStorage.setItem(CHANTS_KEY, JSON.stringify(list)); } catch (e) {} }
        function refreshChants() {
            const box = document.getElementById('chants-box');
            if (box) box.innerHTML = renderChants();

        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function renderChants() {
            const list = loadChants();

                        <button type="button" onclick="chantEdit=null;refreshChants()" class="pressable flex-1 py-2 rounded-xl text-sm font-bold bg-slate-800/60 border border-white/10 text-gray-300">Cancelar</button>
                    </div>
                </div>` : '';
            return `
                <div class="glass-panel p-4 rounded-3xl space-y-3">

                            <svg class="w-4 h-4 mr-2 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"></path></svg>
                            Cánticos de Los de Abajo
                        </h3>
                        <button type="button" onclick="chantEdit='new';chantOpen=null;refreshChants()" class="pressable px-3 py-1.5 rounded-xl text-xs font-bold bg-uchile-blue text-white border border-uchile-gold">+ Agregar</button>
                    </div>
                    ${chantEdit === 'new' ? form : ''}
                    <div class="space-y-2">
                        ${list.map(c => {
                            const open = chantOpen === c.id;
                            return `
                            <div class="rounded-2xl bg-slate-800/50 border ${open ? 'border-blue-500/40' : 'border-white/5'} overflow-hidden">
                                <button type="button" onclick="toggleChant('${c.id}')" class="pressable w-full flex items-center justify-between gap-2 p-3 text-left">
                                    <span class="text-sm font-bold text-blue-400">${esc(c.title)}</span>
                                    <svg class="w-4 h-4 text-gray-400 shrink-0" style="transition:transform .3s;transform:rotate(${open ? 180 : 0}deg)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                ${open ? (chantEdit === c.id ? `<div class="p-3 pt-0">${form}</div>` : `
                                <div class="px-3 pb-3 space-y-3">
                                    <p class="text-sm text-gray-200 leading-relaxed whitespace-pre-line" style="user-select:text;-webkit-user-select:text;">${esc(c.text) || '<span class="text-gray-500 italic">Aún no tiene letra. Toca Editar para pegarla.</span>'}</p>

                                    </div>

                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }
        function toggleChant(id) { chantOpen = chantOpen === id ? null : id; chantEdit = null; refreshChants(); }
        function saveChant(id) {
            const title = document.getElementById('chant-title').value.trim();
            const text = document.getElementById('chant-text').value.replace(/\s+$/, '');
            if (!title) { document.getElementById('chant-title').focus(); return; }
            const list = loadChants();
            if (id === 'new') { const n = 'c' + Date.now(); list.push({ id: n, title, text }); chantOpen = n; }
            else { const c = list.find(x => x.id === id); if (c) { c.title = title; c.text = text; } }
            saveChants(list); chantEdit = null; refreshChants();
        }
        function deleteChant(id) {
            if (!confirm('¿Borrar este cántico?')) return;

        // ============================================================

        function getPref(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }

        function themeBtnClass(on) {

        function setTheme(mode) {
            setPref('uch-theme', mode);

        }
        function setFontScale(v) {
            const n = window.applyFontScale(v);
            setPref('uch-fs', n);
            const o = document.getElementById('fs-out'); if (o) o.textContent = Math.round(n) + '%';
            const r = document.getElementById('fs-range'); if (r && parseFloat(r.value) !== n) r.value = n;

            const cur = parseFloat(getPref('uch-fs', '100')) || 100;

        // Cambia el sub-tab dentro de la vista Competiciones

            if (detail) {
                detail.innerHTML = renderCompetitionDetail(comp);
                // Spring fade-in for the new detail
                if (window.Motion) {
                    try {
                        window.Motion.animate(
                            detail,
                            { opacity: [0, 1], transform: ['translateY(8px)', 'translateY(0)'] },
                            { duration: 0.45, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                        );

        // ============================================================
        // Carga dinámica de datos desde data.json (generado por el
        // scraper Python + GitHub Action). Si fetch falla (ej: abriendo

        // incorrecta, usa FALLBACK_DATA.

        /*LIVE_START*/
        // ============================================================
        // Datos en vivo (ESPN, gratis y sin clave) + data.json (Wikipedia)
        // Si la fuente en vivo falla, la app sigue con data.json / respaldo.
        // ============================================================
        const ESPN_BASE = 'https://site.api.espn.com/apis/';
        const CODE_NAMES = {};
        (typeof standingsData !== 'undefined' ? standingsData : []).forEach(t => { CODE_NAMES[t.code] = t.name; });
        let liveStatus = { standings: false, matches: false, liveAny: false, at: null, error: '' };

        function normName(n) {
            return String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/'{2,}/g, '').toLowerCase().trim();
        }
        function codeForName(name) {
            const n = normName(name);
            if (!n) return null;
            if (/universidad de concepcion|u\.? de concepcion|univ\.? concepcion/.test(n)) return 'UDC';
            if (/universidad de chile|u\.? de chile/.test(n)) return 'UCH';
            if (/catolica/.test(n)) return 'UC';
            if (/colo.?colo/.test(n)) return 'CC';
            if (/everton/.test(n)) return 'EVE';
            if (/palestino/.test(n)) return 'PAL';
            if (/limache/.test(n)) return 'LIM';
            if (/huachipato/.test(n)) return 'HUA';
            if (/nublense/.test(n)) return 'ÑUB';
            if (/serena/.test(n)) return 'SER';
            if (/coquimbo/.test(n)) return 'COQ';
            if (/concepcion/.test(n)) return 'CON';
            if (/audax/.test(n)) return 'AUD';
            if (/higgins/.test(n)) return 'OHI';
            if (/cobresal/.test(n)) return 'CSL';
            if (/calera/.test(n)) return 'ULC';
            return null;
        }
        function cleanTeamName(raw) {
            const code = codeForName(raw);
            return code && CODE_NAMES[code] ? CODE_NAMES[code] : String(raw || '').replace(/'{2,}/g, '').trim();
        }
        function fmtClock(d) { return d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Santiago' }); }
        function fmtDay(d) { return d.toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'America/Santiago' }).replace(/\./g, ''); }
        function fmtShort(d) { return d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', timeZone: 'America/Santiago' }); }

        async function fetchJSON(url, ms) {
            const ctl = new AbortController();
            const t = setTimeout(() => ctl.abort(), ms || 10000);
            try {
                const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.json();
            } finally { clearTimeout(t); }
        }

        function statVal(entry, names) {
            const st = entry.stats || [];
            for (const nm of names) {
                const f = st.find(x => x.name === nm || x.abbreviation === nm || x.type === nm);
                if (f && f.value !== undefined && f.value !== null && isFinite(Number(f.value))) return Number(f.value);
            }
            return null;
        }

        function parseEspnStandings(json) {
            let entries = null;
            if (json && Array.isArray(json.children)) {
                for (const c of json.children) {
                    if (c.standings && Array.isArray(c.standings.entries) && c.standings.entries.length) { entries = c.standings.entries; break; }
                }
            }
            if (!entries && json && json.standings && Array.isArray(json.standings.entries)) entries = json.standings.entries;
            if (!entries || entries.length < 8) throw new Error('standings inválida');
            const rows = [];
            entries.forEach(e => {
                const code = codeForName(e.team && (e.team.displayName || e.team.name || e.team.shortDisplayName));
                if (!code) return;
                rows.push({
                    code, name: CODE_NAMES[code] || e.team.displayName,
                    pj: statVal(e, ['gamesPlayed', 'GP']), g: statVal(e, ['wins', 'W']), e: statVal(e, ['ties', 'draws', 'D']), p: statVal(e, ['losses', 'L']),
                    gf: statVal(e, ['pointsFor', 'F']), gc: statVal(e, ['pointsAgainst', 'A']),
                    dg: statVal(e, ['pointDifferential', 'GD']), pts: statVal(e, ['points', 'P']), rank: statVal(e, ['rank'])
                });
            });
            if (rows.length < 8 || rows.some(r => r.pts === null || r.pj === null)) throw new Error('standings incompleta');
            rows.forEach(r => { if (r.dg === null && r.gf !== null && r.gc !== null) r.dg = r.gf - r.gc; });
            rows.sort((a, b) => (b.pts - a.pts) || ((b.dg || 0) - (a.dg || 0)) || ((b.gf || 0) - (a.gf || 0)));
            const n = rows.length;
            rows.forEach((r, i) => {
                r.pos = i + 1;
                r.zone = r.pos <= 3 ? 'libertadores' : r.pos <= 7 ? 'sudamericana' : (r.pos >= n - 1 ? 'descenso' : undefined);
                if (r.code === 'UCH') r.isU = true;
                delete r.rank;
            });
            return rows;
        }

        function parseEspnEvents(json) {
            const out = [];
            ((json && json.events) || []).forEach(ev => {
                const comp = ev.competitions && ev.competitions[0];
                if (!comp || !comp.competitors) return;
                const h = comp.competitors.find(c => c.homeAway === 'home');
                const a = comp.competitors.find(c => c.homeAway === 'away');
                if (!h || !a) return;
                // Nombre mapeado a código conocido; si no, se usa el nombre real (ej: rivales de copas)
                const hc = codeForName(h.team && (h.team.displayName || h.team.name)) || (h.team && (h.team.displayName || h.team.name)) || '???';
                const ac = codeForName(a.team && (a.team.displayName || a.team.name)) || (a.team && (a.team.displayName || a.team.name)) || '???';
                const hLogo = (h.team && h.team.logo) || '', aLogo = (a.team && a.team.logo) || '';
                const st = (ev.status && ev.status.type) || {};
                // Goles del partido (scoringPlay): minuto, autor y equipo
                const goals = [];
                (comp.details || []).forEach(dt => {
                    if (!dt || !dt.scoringPlay) return;
                    const tid = dt.team && dt.team.id;
                    const side = tid && h.team && String(tid) === String(h.team.id) ? hc : (tid && a.team && String(tid) === String(a.team.id) ? ac : null);
                    const og = /own/i.test((dt.type && dt.type.text) || '');
                    goals.push({
                        min: (dt.clock && dt.clock.displayValue) || '',
                        player: (dt.athletesInvolved && dt.athletesInvolved[0] && dt.athletesInvolved[0].displayName) || '',
                        code: side, og
                    });
                });
                goals.sort((x, y) => (parseInt(x.min, 10) || 0) - (parseInt(y.min, 10) || 0));
                out.push({
                    id: ev.id || '', date: new Date(ev.date), state: st.state || 'pre', typeName: st.name || '', completed: !!st.completed,
                    detail: st.shortDetail || st.detail || '', clock: (ev.status && ev.status.displayClock) || '', period: st.period || null,
                    hc, ac, hs: Number(h.score), as: Number(a.score),
                    venue: (comp.venue && comp.venue.fullName) || '', goals, hLogo, aLogo
                });
            });
            return out.filter(m => !isNaN(m.date.getTime())).sort((x, y) => x.date - y.date);
        }

        function buildLiveFromEvents(events, now) {
            const done = events.filter(m => m.state === 'post' && isFinite(m.hs) && isFinite(m.as));
            // Últimos 5 de cada equipo (del más antiguo al más reciente)
            const form = {};
            done.forEach(m => {
                [[m.hc, m.hs, m.as], [m.ac, m.as, m.hs]].forEach(([c, gf, gc]) => {
                    (form[c] = form[c] || []).push(gf > gc ? 'G' : gf < gc ? 'P' : 'E');
                });
            });
            Object.keys(form).forEach(c => { form[c] = form[c].slice(-5); });

            const uDone = done.filter(m => m.hc === 'UCH' || m.ac === 'UCH').slice(-6).reverse();
            const recent = uDone.map(m => {
                const uHome = m.hc === 'UCH';
                const uG = uHome ? m.hs : m.as, oG = uHome ? m.as : m.hs;
                return {
                    home: CODE_NAMES[m.hc] || m.hc, hCode: m.hc, hScore: m.hs,
                    away: CODE_NAMES[m.ac] || m.ac, aCode: m.ac, aScore: m.as,
                    date: fmtShort(m.date), win: uG > oG, draw: uG === oG
                };
            });

            const uAll = events.filter(m => m.hc === 'UCH' || m.ac === 'UCH');
            const liveU = uAll.find(m => m.state === 'in');
            const upcoming = uAll.filter(m => m.state === 'pre' && !/POSTPON|CANCEL|SUSPEND/i.test(m.typeName) && m.date.getTime() > now - 3 * 3600e3).sort((x, y) => x.date - y.date);
            const pick = liveU || upcoming[0] || null;
            let next = null;
            if (pick) {
                const live = pick.state === 'in';
                const today = fmtShort(pick.date) === fmtShort(new Date(now));
                next = {
                    home_code: pick.hc, away_code: pick.ac, home_logo: pick.hLogo || '', away_logo: pick.aLogo || '',
                    home_name: CODE_NAMES[pick.hc] || pick.hc, away_name: CODE_NAMES[pick.ac] || pick.ac,
                    time: fmtClock(pick.date), day: fmtDay(pick.date), venue: pick.venue || 'Estadio por confirmar',
                    status: live ? 'EN VIVO' : (today ? 'HOY' : 'PRÓXIMO PARTIDO'),
                    competition: pick.league || 'Liga de Primera 2026',
                    live, hScore: pick.hs, aScore: pick.as, clock: pick.clock || pick.detail,
                    period: pick.period || null, goals: pick.goals || [],
                    pollLg: pick.lg || 'chi.1', kickoff: pick.date ? pick.date.getTime() : null
                };
            }
            return { form, recent, next, liveAny: events.some(m => m.state === 'in') };
        }

        // ---------- Gol flash + sondeo ligero del partido de la U ----------
        let uchGoalFlash = { t: 0, text: '' };
        function trackGoalFlash(oldN, newN) {
            try {
                if (!oldN || !newN || !oldN.live || !newN.live) return;
                if (oldN.home_code !== newN.home_code || oldN.away_code !== newN.away_code) return;
                const oh = Number(oldN.hScore) || 0, oa = Number(oldN.aScore) || 0;
                const nh = Number(newN.hScore) || 0, na = Number(newN.aScore) || 0;
                if (nh > oh) uchGoalFlash = { t: Date.now(), text: newN.home_code === 'UCH' ? '¡GOL DE LA U!' : 'Gol de ' + (newN.home_name || '') };
                if (na > oa) uchGoalFlash = { t: Date.now(), text: newN.away_code === 'UCH' ? '¡GOL DE LA U!' : 'Gol de ' + (newN.away_name || '') };
            } catch (e) { /* nunca romper el flujo */ }
        }
        let uchPollLg = 'chi.1', uchPollLabel = 'Primera División', uchPollAt = 0, uchFinalTimer = null;
        function utcYmd(ms) {
            const d = new Date(ms);
            return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, '0') + String(d.getUTCDate()).padStart(2, '0');
        }
        function uchPollDue() {
            const cur = (getData().liga || {}).next_match;
            if (!cur || !cur.kickoff) return false;
            const now = Date.now();
            return !!cur.live || (cur.kickoff - 90 * 60e3 < now && now < cur.kickoff + 3.5 * 3600e3);
        }
        async function pollLive() {
            uchPollAt = Date.now();
            const cur = (getData().liga || {}).next_match;
            if (!cur || !cur.kickoff) return;
            const days = [...new Set([utcYmd(cur.kickoff), utcYmd(Date.now()), utcYmd(Date.now() - 86400e3)])].slice(0, 3);
            let evs = [];
            for (const d of days) {
                try { evs = evs.concat(await fetchLeagueEvents(uchPollLg, uchPollLabel, '?dates=' + d)); } catch (e) { /* sigue */ }
            }
            const m = evs.find(x => (x.hc === cur.home_code && x.ac === cur.away_code) || (x.hc === cur.away_code && x.ac === cur.home_code));
            if (!m) return;
            let changed = false;
            if (m.state === 'in') {
                const nc = String(m.clock || '');
                if (!cur.live || cur.hScore !== m.hs || cur.aScore !== m.as || String(cur.clock || '') !== nc || cur.period !== m.period) {
                    if (cur.live) trackGoalFlash(cur, { home_code: cur.home_code, away_code: cur.away_code, home_name: cur.home_name, away_name: cur.away_name, hScore: m.hs, aScore: m.as, live: true });
                    cur.live = true; cur.status = 'EN VIVO';
                    cur.hScore = m.hs; cur.aScore = m.as; cur.clock = nc; cur.period = m.period; cur.goals = m.goals || [];
                    liveStatus.liveAny = true;
                    changed = true;
                }
            } else if (m.state === 'post' && (cur.live || (m.completed && cur.status !== 'TERMINADO' && Date.now() - m.date.getTime() < 5 * 3600e3))) {
                cur.live = false; cur.status = 'TERMINADO'; cur.clock = 'FINAL';
                cur.hScore = m.hs; cur.aScore = m.as; cur.goals = m.goals || []; cur.period = m.period;
                liveStatus.liveAny = false;
                changed = true;
                if (!uchFinalTimer) uchFinalTimer = setTimeout(() => { uchFinalTimer = null; refreshData(true); }, 90e3);
            } else if (m.state === 'pre' && cur.live) {
                cur.live = false; cur.status = 'HOY'; cur.clock = ''; cur.period = null;
                liveStatus.liveAny = false;
                changed = true;
            }
            if (changed) {
                liveStatus.at = new Date();
                if (currentTab === 'partidos' || currentTab === 'tabla') rerenderCurrent();
                else updateLiveStatus();
            }
        }

        const LIVE_LEAGUES = [
            ['chi.1', 'Primera División'],
            ['conmebol.sudamericana', 'Copa Sudamericana'],
            ['conmebol.libertadores', 'Copa Libertadores']
        ];
        function ymOf(d) { return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, '0'); }
        function ymShift(n) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); return ymOf(d); }
        async function fetchLeagueEvents(slug, label, q) {
            const j = await fetchJSON(ESPN_BASE + 'site/v2/sports/soccer/' + slug + '/scoreboard' + q, 15000);
            const evs = parseEspnEvents(j);
            evs.forEach(e => { e.lg = slug; e.league = label; });
            return evs;
        }
        async function loadLive() {
            const res = { standings: null, events: null };
            const errs = [];
            // Meses anterior + actual + próximo: resultados recientes, forma y próximas fechas.
            // ESPN ya no acepta rangos largos (HTTP 400): se consulta mes por mes.
            const months = [ymShift(-1), ymShift(0), ymShift(1)];
            const jobs = [
                fetchJSON(ESPN_BASE + 'v2/sports/soccer/chi.1/standings').then(j => { res.standings = parseEspnStandings(j); }).catch(e => errs.push('tabla: ' + e.message))
            ];
            LIVE_LEAGUES.forEach(pair => {
                months.forEach(q => {
                    jobs.push(fetchLeagueEvents(pair[0], pair[1], '?dates=' + q)
                        .then(ev => { res.events = (res.events || []).concat(ev); })
                        .catch(e => { if (pair[0] === 'chi.1') errs.push('partidos: ' + e.message); }));
                });
            });
            await Promise.all(jobs);
            if (res.events) {
                res.events.sort((a, b) => a.date - b.date);
                if (!res.events.length) { errs.push('partidos: sin eventos'); res.events = null; }
            }
            return { res, errs };
        }
/*LIVE_END*/

        async function loadData() {
            // 1) data.json (Wikipedia, generado por el Action): copas, goleadores, asistencias
            let base = null;
            try {
                const r = await fetch('data.json?v=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const parsed = await r.json();
                if (!parsed || !parsed.liga || !Array.isArray(parsed.liga.standings) || !parsed.liga.standings.length) throw new Error('Estructura de data.json inválida');
                base = parsed;
            } catch (err) {
                console.warn('[Mi UChile] data.json no disponible:', err.message);
            }
            const merged = base ? JSON.parse(JSON.stringify(base)) : JSON.parse(JSON.stringify(FALLBACK_DATA));
            // Limpieza de nombres/flags de los resultados que vienen de Wikipedia
            if (merged.liga && Array.isArray(merged.liga.recent_results)) {
                merged.liga.recent_results = merged.liga.recent_results.map(r => {
                    const hCode = r.hCode || codeForName(r.home), aCode = r.aCode || codeForName(r.away);
                    const uHome = hCode === 'UCH';
                    const uG = uHome ? r.hScore : r.aScore, oG = uHome ? r.aScore : r.hScore;
                    return Object.assign({}, r, {
                        home: cleanTeamName(r.home), away: cleanTeamName(r.away), hCode, aCode,
                        win: r.win !== undefined ? r.win : uG > oG, draw: r.draw !== undefined ? r.draw : uG === oG
                    });
                });
            }
            // 2) ESPN en vivo: tabla, resultados, últimos 5 y próximo partido
            let errs = [];
            try {
                const { res, errs: e2 } = await loadLive();
                errs = e2;
                liveStatus.standings = !!res.standings;
                liveStatus.matches = !!res.events;
                if (res.standings) merged.liga.standings = res.standings;
                if (res.events) {
                    const b = buildLiveFromEvents(res.events, Date.now());
                    merged.liga.standings.forEach(t => { if (b.form[t.code]) t.last5 = b.form[t.code]; });
                    if (b.recent.length) merged.liga.recent_results = b.recent;
                    trackGoalFlash(appData && appData.liga ? appData.liga.next_match : merged.liga.next_match, b.next);
                    merged.liga.next_match = b.next;
                    if (b.next && b.next.pollLg) { uchPollLg = b.next.pollLg; uchPollLabel = b.next.league || uchPollLabel; }
                    liveStatus.liveAny = b.liveAny;
                } else { liveStatus.liveAny = false; }
            } catch (err) {
                errs.push(err.message);
                liveStatus.standings = false; liveStatus.matches = false; liveStatus.liveAny = false;
            }
            liveStatus.error = errs.join(' · ');
            liveStatus.at = new Date();
            if (liveStatus.standings || liveStatus.matches) {
                merged.meta = Object.assign({}, merged.meta || {}, { fuente: 'ESPN (en vivo) + Wikipedia' });
            }
            appData = merged;
            console.log('[Mi UChile] datos', { liveStatus, jsonOk: !!base });
        }

        // ---------- Refresco automático ----------
        let refreshing = false, lastRefresh = Date.now();
        function statusText() {
            const t = liveStatus.at ? fmtClock(liveStatus.at) : '—';
            if (liveStatus.standings && liveStatus.matches) return (liveStatus.liveAny ? '🔴 Partido en juego · ' : '') + 'En vivo (ESPN) · actualizado ' + t;
            if (liveStatus.standings || liveStatus.matches) return 'En vivo parcial (ESPN) · actualizado ' + t;
            return 'Sin conexión con la fuente en vivo · mostrando datos guardados';
        }
        function updateLiveStatus() {
            document.querySelectorAll('.live-status').forEach(el => { el.textContent = statusText(); });
            const d = document.getElementById('live-detail');
            if (d) {
                const m = getData().meta || {};
                const w = m.ultima_actualizacion ? new Date(m.ultima_actualizacion).toLocaleString('es-CL') : '—';
                d.textContent = 'Goleadores y asistencias (Wikipedia): ' + w + (liveStatus.error ? ' · Aviso: ' + liveStatus.error : '');
            }
        }
        function rerenderCurrent() {
            const content = document.getElementById('app-content');
            if (!content) return;
            if (currentTab === 'tabla') content.innerHTML = renderStandings();
            else if (currentTab === 'partidos') content.innerHTML = renderMatches();
            else if (currentTab === 'club' && currentClubSection === 'estadisticas') { const c = document.getElementById('club-content'); if (c) c.innerHTML = renderClubSection('estadisticas'); }
            else return;
            content.querySelectorAll('.tab-content, .tab-content > *').forEach(el => { el.style.animation = 'none'; });
        }
        async function refreshData(force) {
            if (refreshing) return;
            refreshing = true;
            const btn = document.getElementById('refresh-btn'); if (btn) btn.textContent = 'Actualizando…';
            try {
                const sig = () => JSON.stringify([getData().liga, getData().estadisticas]);
                const before = sig();
                await loadData();
                if (sig() !== before) rerenderCurrent();
            } catch (e) { console.warn('[Mi UChile] refresh falló', e); }
            finally {
                refreshing = false; lastRefresh = Date.now();
                if (btn) btn.textContent = 'Actualizar ahora';
                updateLiveStatus();
            }
        }
        function startAutoRefresh() {
            setInterval(() => {
                if (document.hidden) return;
                if (uchPollDue() && Date.now() - uchPollAt >= 20e3) pollLive();
                if (Date.now() - lastRefresh >= 3 * 60e3) refreshData();
            }, 15e3);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) return;
                if (uchPollDue() && Date.now() - uchPollAt >= 20e3) pollLive();
                if (Date.now() - lastRefresh > 45e3) refreshData();
            });
            window.addEventListener('online', () => refreshData());
        }

        // ============================================================
        // Inicialización — usa DOMContentLoaded (no espera a `load`)
        // para no depender de que el CDN de Motion cargue. Si el
        // documento ya está parsed, ejecuta inmediatamente.
        // ============================================================
        async function initApp() {
            try {
                await loadData();
                switchTab('tabla');
                startAutoRefresh();
            } catch (err) {
                console.error('[Mi UChile] Error al inicializar:', err);
                // Mostrar mensaje de error visible en lugar de pantalla en blanco
                document.getElementById('app-content').innerHTML = `
                    <div class="glass-panel p-6 rounded-3xl text-center space-y-3">
                        <div class="text-red-400 text-4xl">⚠</div>
                        <h2 class="text-lg font-bold text-white">No se pudo cargar la app</h2>
                        <p class="text-xs text-gray-400">Error: ${err.message || 'desconocido'}</p>
                        <p class="text-xs text-gray-500 mt-4">Abre la consola (F12) para más detalles, o recarga la página.</p>
                        <button onclick="location.reload()" class="pressable mt-4 px-4 py-2 rounded-xl bg-uchile-blue text-white text-sm font-bold border border-uchile-gold">Recargar</button>
                    </div>
                `;
            }
        }

/* ===== Avisos push (PushKit) ===== */
const PUSH_CFG = { worker: 'https://avisos-diego.diegoro22.workers.dev', app: 'uch', defaults: { lead: 60, change: true, goals: true } };
const PushKit = (() => {
  const LS = 'push-prefs-' + PUSH_CFG.app;
  const prefs = () => { try { return Object.assign({}, PUSH_CFG.defaults, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) { return { ...PUSH_CFG.defaults }; } };
  const savePrefs = (p) => { try { localStorage.setItem(LS, JSON.stringify(p)); } catch (e) {} };
  const u8 = (b64) => { const p = '='.repeat((4 - b64.length % 4) % 4); const r = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, (c) => c.charCodeAt(0)); };
  const post = (path, body) => fetch(PUSH_CFG.worker + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json());
  const standalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const supported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  let msg = '';
  async function reg() { return navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready); }
  async function current() { if (!supported()) return null; try { return await (await navigator.serviceWorker.getRegistration())?.pushManager.getSubscription() || null; } catch (e) { return null; } }
  async function sync() { // reenvía preferencias al Worker
    const sub = await current(); if (!sub) return;
    await post('/subscribe', { app: PUSH_CFG.app, subscription: sub.toJSON(), prefs: prefs() });
  }
  function ui(html) { const b = document.getElementById('push-box'); if (b) b.innerHTML = html; }
  async function render() {
    const box = document.getElementById('push-box'); if (!box) return;
    if (PUSH_CFG.worker.includes('PEGA_AQUI')) { ui('<p class="text-xs text-amber-400">Falta configurar la URL del Worker (PUSH_CFG.worker).</p>'); return; }
    if (!supported() || !standalone()) { ui('<p class="text-xs text-amber-400">Para recibir avisos, instala la app en la pantalla de inicio (Compartir → Agregar a inicio) y ábrela desde ahí.</p>'); return; }
    const sub = await current(), p = prefs(), on = !!sub && Notification.permission === 'granted';
    const btn = 'pressable w-full py-2.5 rounded-xl text-sm font-bold border border-white/10 ';
    const sel = (k, opts) => `<select onchange="PushKit.set('${k}',this.value)" class="bg-slate-800/60 border border-white/10 text-gray-200 rounded-xl px-2 py-2" style="font-size:16px">${opts.map(([v, l]) => `<option value="${v}" ${String(p[k]) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    const chk = (k, l) => `<label class="flex items-center justify-between gap-3 text-sm text-gray-200"><span>${l}</span><input type="checkbox" ${p[k] !== false ? 'checked' : ''} onchange="PushKit.set('${k}',this.checked)" style="width:22px;height:22px"></label>`;
    ui(`<p class="text-sm font-semibold ${on ? 'text-green-400' : 'text-gray-400'}">${on ? '● Notificaciones activadas' : (Notification.permission === 'denied' ? '● Bloqueadas en Ajustes de iOS' : '○ Desactivadas')}</p>
      ${on ? `<div class="flex items-center justify-between gap-3 text-sm text-gray-200"><span>Avisar antes del partido</span>${sel('lead', [[0,'No'],[30,'30 min'],[60,'1 hora'],[180,'3 horas'],[1440,'1 día']])}</div>${chk('change','Avisar si cambia fecha u hora')}${chk('goals','Goles y marcador en vivo')}` : ''}
      ${on ? `<button class="${btn} bg-slate-800/60 text-gray-200" onclick="PushKit.test()">Enviar aviso de prueba</button><button class="${btn} bg-slate-800/60 text-gray-200" onclick="PushKit.off()">Desactivar</button>`
           : `<button class="${btn} bg-uchile-blue text-white" onclick="PushKit.on()">Activar notificaciones</button>`}
      <p class="text-[11px] text-gray-500">${msg}</p>`);
  }
  return {
    render,
    async on() {
      try {
        msg = 'Activando…'; render();
        const perm = await Notification.requestPermission(); if (perm !== 'granted') { msg = 'Permiso denegado.'; return render(); }
        const caches_ = await caches.open('push-cfg'); await caches_.put('/cfg', new Response(JSON.stringify({ worker: PUSH_CFG.worker })));
        const r = await reg();
        const key = (await (await fetch(PUSH_CFG.worker + '/vapid')).json()).key;
        let sub = await r.pushManager.getSubscription();
        if (!sub) sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(key) });
        await post('/subscribe', { app: PUSH_CFG.app, subscription: sub.toJSON(), prefs: prefs() });
        msg = 'Listo. Prueba con el botón de abajo.';
      } catch (e) { msg = 'Error: ' + (e.message || e); }
      render();
    },
    async off() { const s = await current(); if (s) { try { await post('/unsubscribe', { endpoint: s.endpoint }); } catch (e) {} await s.unsubscribe(); } msg = 'Desactivadas.'; render(); },
    async test() { const s = await current(); if (!s) return; msg = 'Enviando…'; render(); try { const r = await post('/test', { subscription: s.toJSON() }); msg = r.ok ? 'Enviado: debería llegar en segundos.' : 'No se pudo enviar (' + (r.error || r.status) + ').'; } catch (e) { msg = 'Error de red.'; } render(); },
    async set(k, v) { const p = prefs(); p[k] = (v === 'true' || v === 'false') ? v === 'true' : (isNaN(v) ? v : Number(v)); savePrefs(p); try { await sync(); } catch (e) {} },
    init() {
      new MutationObserver(() => { if (document.getElementById('push-box') && !document.getElementById('push-box').dataset.r) { document.getElementById('push-box').dataset.r = 1; render(); } }).observe(document.body, { childList: true, subtree: true });
      if (supported() && !PUSH_CFG.worker.includes('PEGA_AQUI')) { caches.open('push-cfg').then((c) => c.put('/cfg', new Response(JSON.stringify({ worker: PUSH_CFG.worker })))).catch(() => {}); current().then((s) => s && reg().then(sync)).catch(() => {}); }
    },
  };
})();
PushKit.init();

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            // El DOM ya está listo (script está al final del body)
            initApp();
        }
    </script>
</body>
</html>
