<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Nombre de la app en iOS / Android (cuando se agrega a pantalla de inicio) -->
    <meta name="apple-mobile-web-app-title" content="U. de Chile">
    <meta name="application-name" content="U. de Chile">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0B0F19">
    <script>
    /* Tema (claro/oscuro/auto) y tamaño de letra: se aplican antes de pintar para evitar parpadeos */
    (function () {
        var root = document.documentElement;
        function g(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
        window.applyTheme = function (mode) {
            var m = mode || g('uch-theme', 'dark');
            var light = m === 'light' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
            root.classList.toggle('light', light);
            root.classList.toggle('dark', !light);
            var tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.setAttribute('content', light ? '#002B7A' : '#0B0F19');
        };
        window.applyFontScale = function (p) {
            var v = parseFloat(p);
            if (!isFinite(v)) v = parseFloat(g('uch-fs', '100'));
            if (!isFinite(v)) v = 100;
            v = Math.max(85, Math.min(140, v));
            root.style.fontSize = (16 * v / 100) + 'px';
            return v;
        };
        window.applyTopExtra = function (p) {
            var v = parseFloat(p);
            if (!isFinite(v)) v = parseFloat(g('uch-top', '28'));
            if (!isFinite(v)) v = 28;
            v = Math.max(0, Math.min(60, v));
            root.style.setProperty('--top-extra', v + 'px');
            return v;
        };
        window.applyTheme(); window.applyFontScale(); window.applyTopExtra();
        if (window.matchMedia) {
            var mq = matchMedia('(prefers-color-scheme: light)');
            var h = function () { if (g('uch-theme', 'dark') === 'auto') window.applyTheme(); };
            if (mq.addEventListener) mq.addEventListener('change', h);
        }
    })();
    </script>

    <!-- Iconos de app (iOS home screen + Android + favicon) usando el logo de la U. de Chile -->
    <link rel="apple-touch-icon" sizes="512x512" href="logos/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logos/icon-180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="logos/icon-152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="logos/icon-120.png">
    <link rel="icon" type="image/png" sizes="512x512" href="logos/icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logos/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logos/icon-32.png">
    <link rel="shortcut icon" href="logos/icon-32.png">

    <title>Club Universidad de Chile — App Oficial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'uchile-blue': '#002B7A',
                        'uchile-red': '#D31118',
                        'uchile-gold': '#D4AF37',
                        'ios-bg': '#0B0F19',
                        'ios-card': 'rgba(26, 34, 52, 0.75)',
                    }
                }
            }
        }
    </script>

    <!-- Motion library for spring animations (Apple-style, §4) -->
    <script type="module">
        import { animate, stagger } from 'https://cdn.jsdelivr.net/npm/motion@10.16.4/+esm';
        window.Motion = { animate, stagger };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');

        /* ============================================
           Apple Design tokens (skill: apple-design)
           ============================================ */
        :root {
            --spring-easing: cubic-bezier(0.22, 1, 0.36, 1);     /* critically damped feel */
            --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);  /* slight overshoot for momentum */
            --text-primary: #F3F4F6;
        }

        * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-optical-sizing: auto;  /* §15: optical sizing */
        }

        body {
            background-color: #0B0F19;
            color: #F3F4F6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            letter-spacing: -0.011em;  /* §15: body tracking */
        }

        /* §15: Typography — size-specific tracking & leading (Apple optical sizing) */
        h1, h2, h3 {
            letter-spacing: -0.02em;   /* tighten large text */
            font-weight: 700;
            font-optical-sizing: auto;
        }
        .text-xs, .text-[11px], .text-[10px] {
            letter-spacing: 0.01em;    /* small text wants slightly positive tracking */
        }
        .uppercase.tracking-widest, .uppercase.tracking-wider {
            letter-spacing: 0.08em;    /* captions stay airy */
        }

        /* ============================================
           §12: Materials & depth — translucency conveys hierarchy
           ============================================ */
        .glass-panel {
            background: rgba(22, 30, 49, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-color: rgba(255, 255, 255, 0.18);  /* bright top edge = light catching material */
            box-shadow:
                0 1px 0 0 rgba(255, 255, 255, 0.06) inset,
                0 8px 32px -8px rgba(0, 0, 0, 0.4);
        }

        .glass-panel-highlight {
            background: linear-gradient(135deg, rgba(0, 43, 122, 0.85) 0%, rgba(211, 17, 24, 0.75) 100%);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-top-color: rgba(255, 255, 255, 0.28);
            box-shadow:
                0 1px 0 0 rgba(255, 255, 255, 0.2) inset,
                0 8px 32px 0 rgba(0, 43, 122, 0.37);
        }


        /* §12: Vibrancy — text legible sobre backgrounds translúcidos */
        .glass-panel-highlight strong,
        .glass-panel-highlight span {
            font-weight: 500;
        }

        /* §12: Scroll edge effects instead of hard dividers */
        .scroll-fade-top {
            position: relative;
        }
        .scroll-fade-top::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 12px;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.6), transparent);
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================
           §1 & §10: Press feedback — respond on pointer-down, instant
           ============================================ */
        input, textarea { user-select: text; -webkit-user-select: text; font-size: 16px; }
        .pressable {
            transition: transform 0.4s var(--spring-easing);
            will-change: transform;
            cursor: pointer;
        }
        .pressable:active {
            transform: scale(0.97);
            transition: transform 100ms ease-out;
        }


        /* ============================================
           §3 & §8: Tab content entrance — hint in direction of motion (spring)
           ============================================ */
        .tab-content {
            animation: tabEnter 0.5s var(--spring-easing) both;
        }
        @keyframes tabEnter {
            0%   { opacity: 0; transform: translateY(10px) scale(0.985); filter: blur(4px); }
            60%  { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .tab-content > * {
            animation: childEnter 0.5s var(--spring-easing) both;
            animation-delay: calc(var(--i, 0) * 50ms);
        }
        @keyframes childEnter {
            0%   { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* §4 & §5: Player markers — spring on formation change */
        .player-marker {
            transition: top 0.55s var(--spring-bounce), left 0.55s var(--spring-bounce), transform 0.4s var(--spring-easing);
            will-change: transform, top, left;
        }
        .player-marker:active { transform: scale(0.92); }

        /* Custom Scrollbar for Standings Table */
        .table-container::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .table-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        /* Hide Scrollbars in iOS Tab Views */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* §13: Soft pulse refinement (multimodal feedback — visual layer) */
        @keyframes softPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.55; }
        }
        .animate-pulse { animation: softPulse 2s ease-in-out infinite; }

        /* ============================================
           §14: Reduced motion & accessibility
           ============================================ */
        @media (prefers-reduced-motion: reduce) {
            .tab-content, .tab-content > *, .player-marker, .pressable, .nav-btn, .nav-btn svg, .animate-pulse {
                animation: none !important;
                transition: opacity 200ms ease !important;
                transform: none !important;
                filter: none !important;
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .glass-panel, .glass-nav, .glass-panel-highlight {
                background: rgba(20, 28, 46, 0.95) !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
        }
        @media (prefers-contrast: more) {
            .glass-panel, .glass-nav, .glass-panel-highlight {
                border-color: rgba(255, 255, 255, 0.35) !important;
            }
        }

        /* ============================================
           Tema, áreas seguras y tamaño de letra
           ============================================ */
        :root { --label2: #6b7280; --tint: #0A60FF; --card: #ffffff; }
        html.dark { --label2: #98a2b3; --tint: #60A5FA; --card: #161e31; }
        html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
        html.light { color-scheme: light; }
        body { padding-bottom: calc(8rem + env(safe-area-inset-bottom)); }
        /* La cabecera ahora respeta la isla / barra de estado del iPhone */
        #app-header { padding-top: calc(env(safe-area-inset-top) + var(--top-extra, 28px)); }
        /* Los textos en px de Tailwind también escalan con el tamaño de letra */
        .text-\[10px\] { font-size: .625rem !important; }
        .text-\[11px\] { font-size: .6875rem !important; }
        .standings-table td, .standings-table th { overflow: hidden; }

        /* ============================================
           Modo claro
           ============================================ */
        html.light body { background: #F2F2F7 !important; color: #111827 !important; }
        html.light .glass-panel {
            background: rgba(255,255,255,.74);
            border: 1px solid rgba(0,0,0,.06);
            border-top-color: rgba(255,255,255,.95);
            box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 6px 24px -10px rgba(0,0,0,.18);
        }
        html.light .text-white { color: #0B1220 !important; }
        html.light [class*="text-gray-100"], html.light [class*="text-gray-200"], html.light [class*="text-gray-300"] { color: #1f2937 !important; }
        html.light [class*="text-gray-400"], html.light [class*="text-gray-500"] { color: #667085 !important; }
        html.light [class*="text-gray-600"] { color: #98a2b3 !important; }
        html.light .text-blue-300, html.light .text-blue-400 { color: #1D4ED8 !important; }
        html.light .text-red-400 { color: #DC2626 !important; }
        html.light .text-emerald-300, html.light .text-emerald-400 { color: #047857 !important; }
        html.light .text-yellow-300, html.light .text-yellow-400 { color: #B45309 !important; }
        html.light .text-purple-400 { color: #7C3AED !important; }
        html.light .text-cyan-300 { color: #0E7490 !important; }
        html.light [class*="bg-slate-"] { background-color: rgba(255,255,255,.66) !important; }
        html.light thead tr { background-color: rgba(0,0,0,.05) !important; }
        html.light [class*="bg-black"] { background-color: rgba(0,0,0,.06) !important; }
        html.light [class*="border-white"] { border-color: rgba(0,0,0,.08) !important; }
        html.light [class*="divide-white"] > * { border-color: rgba(0,0,0,.07) !important; }
        html.light .bg-uchile-blue.text-white, html.light .bg-uchile-blue .text-white { color: #fff !important; }
        /* Lo que va sobre el degradado azul/rojo se mantiene claro */
        html.light .glass-panel-highlight { color: #fff; }
        html.light .glass-panel-highlight .text-white,
        html.light .glass-panel-highlight [class*="text-gray-"] { color: #fff !important; }
        html.light .glass-panel-highlight .text-yellow-300 { color: #fde047 !important; }
        html.light .glass-panel-highlight .text-emerald-300,
        html.light .glass-panel-highlight .text-emerald-400 { color: #6ee7b7 !important; }
        html.light .glass-panel-highlight .text-uchile-gold { color: #D4AF37 !important; }
        /* Cabecera: en claro se mantiene azul institucional (el reloj del iPhone sigue blanco) */
        html.light #app-header { background: linear-gradient(135deg, rgba(0,43,122,.97), rgba(16,28,66,.97)); border-color: rgba(255,255,255,.12); }
        html.light #app-header h1 { color: #fff !important; }
        html.light #app-header p { color: rgba(255,255,255,.72) !important; }
        html.light #app-header .hdr-badge { background: rgba(255,255,255,.16) !important; color: #fff !important; border-color: rgba(255,255,255,.28) !important; }

        /* ───────── Tab bar · Liquid Glass ───────── */
        :root {
            --lg-glass: rgba(255,255,255,.46); --lg-ink: var(--tint); --lg-edge: rgba(0,0,0,.10);
            --lg-sink: rgba(0,0,0,.16); --lg-sink2: rgba(0,0,0,.10); --lg-vig: rgba(0,0,0,.10); --lg-cast: rgba(0,0,0,.18);
            --lg-blend: normal; --lg-ca-op: .6;
        }
        html.dark {
            --lg-glass: rgba(30,30,33,.38); --lg-ink: var(--tint); --lg-edge: rgba(255,255,255,.14);
            --lg-sink: rgba(0,0,0,.65); --lg-sink2: rgba(0,0,0,.45); --lg-vig: rgba(0,0,0,.38); --lg-cast: rgba(0,0,0,.4);
            --lg-blend: screen; --lg-ca-op: 1;
        }
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 0 1rem calc(env(safe-area-inset-bottom) + .5rem); pointer-events: none; }
        .lg-bar {
            position: relative; pointer-events: auto; max-width: 30rem; margin: 0 auto; height: 4.75rem; border-radius: 99px;
            background: var(--lg-glass);
            -webkit-backdrop-filter: blur(7px) saturate(1.5); backdrop-filter: blur(7px) saturate(1.5);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 .5px var(--lg-edge), 0 10px 30px var(--lg-cast);
            will-change: transform; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
        }
        .lg-tabs { position: absolute; left: 0; top: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px; }
        .tabbar button, .lg-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1875rem; padding: .375rem 0; color: var(--label2); font-size: .75rem; font-weight: 600; letter-spacing: .01em; border-radius: 2rem; }
        .tabbar button { transition: transform 120ms ease-out; }
        .tabbar button svg, .lg-tab svg { width: 1.75rem; height: 1.75rem; margin: 0; flex-shrink: 0; }
        .lg-tab { pointer-events: none; }
        .lg-main .lg-tab { color: var(--lg-ink); }
        .lg-r .lg-tab { color: #ff2a45; }
        .lg-b .lg-tab { color: #2a8bff; }
        .lg-r, .lg-b { mix-blend-mode: var(--lg-blend); opacity: var(--lg-ca-op); }
        .lg-lens {
            position: absolute; left: 0; top: 4px; will-change: transform;
            background: radial-gradient(closest-side at 50% 50%, rgba(255,255,255,.03) 55%, var(--lg-vig) 100%);
            -webkit-backdrop-filter: brightness(.92) saturate(1.4); backdrop-filter: brightness(.92) saturate(1.4);
            box-shadow:
                inset 0 7px 9px -5px var(--lg-sink),
                inset 0 -6px 8px -5px var(--lg-sink2),
                inset 2px 0 2px -1px rgba(255,90,80,.35),
                inset -2px 0 2px -1px rgba(80,150,255,.4),
                inset 0 0 0 1px var(--lg-edge),
                inset 0 1px 0 rgba(255,255,255,.85),
                inset 0 -1px 0 rgba(255,255,255,.35),
                0 3px 12px var(--lg-cast);
        }
        .lg-lens::after { content: ""; position: absolute; left: 24%; right: 24%; top: 1px; height: 3px; border-radius: 3px;
            background: linear-gradient(90deg, rgba(120,200,255,0), rgba(255,255,255,.95) 30%, rgba(255,255,255,.95) 70%, rgba(255,120,120,0)); filter: blur(.4px); pointer-events: none; }
        .lg-lens::before { content: ""; position: absolute; left: 30%; right: 30%; bottom: 1px; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events: none; }
        .lg-clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; isolation: isolate; }
        .lg-clone { position: absolute; left: 0; top: 0; pointer-events: none; }
        .lg-glare { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: var(--lg-blend); opacity: 0;
            background: radial-gradient(circle at var(--gx, 30%) var(--gy, 12%), rgba(255,255,255,.8) 0, rgba(190,225,255,.4) 16%, rgba(255,255,255,0) 52%); }
        .lg-rim { position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; pointer-events: none; opacity: .9;
            background: conic-gradient(from var(--ang, -30deg), rgba(255,255,255,0) 0deg, rgba(255,255,255,.95) 26deg, rgba(120,200,255,.5) 48deg, rgba(255,255,255,0) 90deg, rgba(255,255,255,0) 180deg, rgba(255,150,130,.45) 215deg, rgba(255,255,255,.7) 238deg, rgba(255,255,255,0) 285deg);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
        /* Capa de toque: recibe todos los gestos, un poco más grande que la barra para que las orillas respondan */
        .lg-hit { position: absolute; inset: -10px -8px; z-index: 5; border-radius: 99px; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .lg-bar > :not(.lg-hit) { pointer-events: none; }
        .lg-range { width: 100%; accent-color: var(--tint); margin: 0; height: 1.75rem; }
        @media (prefers-reduced-transparency: reduce) { .lg-bar { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; } }

        /* ============================================
           Fondo decorativo de la app (imagen U)
           ============================================ */
        #app-fondo {
            position: fixed;
            inset: 0;
            z-index: -1;
            /* Carga el fondo desde la raíz O desde logos/ (la que exista; si están en ambos lugares también funciona) */
            background-image: url('fondo-u.png'), url('logos/fondo-u.png');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0.30;               /* visible pero sin estorbar la lectura */
            pointer-events: none;
        }
        html.light #app-fondo { opacity: 0.15; }
        @media (prefers-reduced-transparency: reduce) { #app-fondo { opacity: 0.10; } }
    </style>
</head>
<body class="bg-ios-bg text-gray-100 min-h-screen flex flex-col">

    <!-- Fondo decorativo de la app (detrás de todo el contenido, no interactivo) -->
    <div id="app-fondo" aria-hidden="true"></div>

    <!-- Header / Status Bar Area (original) -->
    <header id="app-header" class="sticky top-0 z-40 glass-panel border-b border-white/10 px-4 pb-3 flex items-center justify-between gap-3 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 flex items-center justify-center shrink-0 drop-shadow-[0_0_6px_rgba(212,175,55,0.45)]">
                <img src="logos/universidad-de-chile.png" alt="Club Universidad de Chile" class="w-10 h-10 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>
                <div class="w-10 h-10 rounded-full bg-uchile-blue border-2 border-uchile-gold flex items-center justify-center font-bold text-white shadow-md pressable" style="display:none;">
                    U
                </div>
            </div>
            <div>
                <h1 class="font-bold text-base leading-none tracking-tight">Club Universidad de Chile</h1>
                <p class="text-[11px] text-gray-400 font-medium mt-0.5">App Oficial del Romántico Viajero</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="hdr-badge whitespace-nowrap inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-400 mr-1.5 animate-pulse"></span> Primera 2026
            </span>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main id="app-content" class="flex-grow p-4 max-w-4xl mx-auto w-full">
        <!-- Loader inicial — se reemplaza al cargar el JS -->
        <div id="initial-loader" class="flex flex-col items-center justify-center min-h-[60vh] gap-3 text-gray-400">
            <svg class="w-10 h-10 animate-spin text-blue-400" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <p class="text-sm">Cargando Club Universidad de Chile…</p>
            <p class="text-[10px] text-gray-600">Si esto no desaparece, revisa la consola (F12)</p>
        </div>
        <!-- Content injected via JavaScript -->
    </main>

    <!-- Bottom Navigation Bar · Liquid Glass (iOS 26) -->
    <nav class="tabbar" aria-label="Navegación principal">
        <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <script>
    /* Liquid Glass tab bar: gota de vidrio con lupa, reflejo de luz y dispersión de color */
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var bar = $('lg-bar'), base = $('lg-base'), lens = $('lg-lens'), clone = $('lg-clone');
        var chR = $('lg-r'), chB = $('lg-bl'), main = $('lg-main'), glare = $('lg-glare'), rim = $('lg-rim');
        var btns = base.querySelectorAll('button');
        var IDS = Array.prototype.map.call(btns, function (b) { return b.id.replace('tab-btn-', ''); });
        var N = IDS.length;
        var html = Array.prototype.map.call(btns, function (b) { return '<span class="lg-tab">' + b.innerHTML + '</span>'; }).join('');
        [chR, chB, main].forEach(function (c) { c.innerHTML = html; });
        var layerTabs = [chR, chB, main].map(function (c) { return c.querySelectorAll('.lg-tab'); });
        [base, chR, chB, main].forEach(function (c) { c.style.gridTemplateColumns = 'repeat(' + N + ', 1fr)'; });

        function ld(k, d) { try { var v = parseFloat(localStorage.getItem(k)); return isFinite(v) ? v : d; } catch (e) { return d; } }
        function sv(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
        var DEF = { mag: 1.3, dis: 1, glr: 1, wet: 1 };
        var mag = ld('gp-lg-mag', DEF.mag), dis = ld('gp-lg-dis', DEF.dis), glr = ld('gp-lg-glr', DEF.glr), wet = ld('gp-lg-wet', DEF.wet);
        var clip = lens.querySelector('.lg-clip'), lgDisp = $('lg-disp'), lgTurb = $('lg-turb');

        var W = 0, H = 0, tabW = 0, lensH = 0, PAD = 4;
        var current = 0, x = 0, vx = 0, target = 0, grow = 0, vg = 0, growTarget = 0, dragging = false, raf = 0, last = 0;
        var flash = 0, gx = 0.3, gy = 0.15;
        var activeId = null, lastMove = 0;
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var K = 240, C = reduce ? 40 : 21;

        function xFor(i) { return PAD + i * tabW; }
        function measure() {
            W = bar.clientWidth; H = bar.clientHeight;
            tabW = (W - PAD * 2) / N; lensH = H - PAD * 2;
            [base, chR, chB, main].forEach(function (t) { t.style.width = W + 'px'; t.style.height = H + 'px'; });
            lens.style.width = tabW + 'px'; lens.style.height = lensH + 'px'; lens.style.borderRadius = (lensH / 2) + 'px';
            clone.style.width = W + 'px'; clone.style.height = H + 'px';
            if (!dragging) { x = target = xFor(current); }
        }
        function localX(e) { var r = bar.getBoundingClientRect(); return (e.clientX - r.left) * (W / (r.width || 1)); }
        function clampX(px) { return Math.max(PAD, Math.min(W - PAD - tabW, px)); }
        function indexAt(px) { return Math.max(0, Math.min(N - 1, Math.floor((px - PAD) / tabW))); }

        function render() {
            var stretch = Math.min(Math.abs(vx) / 2600, 0.28);
            var sx = (1 + grow * 0.14) * (1 + stretch), sy = (1 + grow * 0.24) * (1 - stretch * 0.4);
            lens.style.transform = 'translate3d(' + x + 'px,0,0) scale(' + sx + ',' + sy + ')';
            bar.style.transform = 'scale(' + (1 + grow * 0.03) + ')';
            var ca = dis * (0.3 + grow * 0.5 + Math.min(Math.abs(vx) / 2200, 1.1));
            chR.style.transform = 'translate(' + (-ca) + 'px,' + (-ca * 0.35) + 'px)';
            chB.style.transform = 'translate(' + ca + 'px,' + (ca * 0.35) + 'px)';
            glare.style.setProperty('--gx', (gx * 100) + '%'); glare.style.setProperty('--gy', (gy * 100) + '%');
            glare.style.opacity = String(Math.min(1, glr * (0.12 + grow * 0.5 + flash * 0.8)));
            rim.style.setProperty('--ang', (-35 + (x / Math.max(W, 1)) * 70) + 'deg');
            rim.style.opacity = String(Math.min(1, 0.55 + glr * 0.35 + grow * 0.2));
            var s = mag * (1 + grow * 0.1);
            clone.style.transformOrigin = (tabW / 2) + 'px ' + (lensH / 2) + 'px';
            clone.style.transform = 'scale(' + (1 / sx) + ',' + (1 / sy) + ') translate(' + (-x) + 'px,' + (-PAD) + 'px)';
            /* Los íconos base se desvanecen solo bajo la gota, con borde suave: el color de la lente los "pinta" de a poco */
            var cx = x + tabW / 2, half = tabW * sx / 2;
            var mk = 'linear-gradient(90deg,#000 0,#000 ' + (cx - half) + 'px,transparent ' + (cx - half * 0.5) + 'px,transparent ' + (cx + half * 0.5) + 'px,#000 ' + (cx + half) + 'px,#000 100%)';
            base.style.webkitMaskImage = mk; base.style.maskImage = mk;
            /* La capa de color entra por el borde de la gota y mancha el ícono de a poco, en su mismo lugar */
            var tk = 'linear-gradient(90deg,transparent 0,transparent ' + (cx - half) + 'px,#000 ' + (cx - half * 0.5) + 'px,#000 ' + (cx + half * 0.5) + 'px,transparent ' + (cx + half) + 'px,transparent 100%)';
            clone.style.webkitMaskImage = tk; clone.style.maskImage = tk;
            /* Lupa: cada ícono crece sobre su propio centro según cuánto lo cubre la gota */
            for (var li = 0; li < N; li++) {
                var dd = Math.abs(cx - (xFor(li) + tabW / 2)) / tabW;
                var w = Math.max(0, 1 - dd / 0.85); w = w * w * (3 - 2 * w);
                var kk = 'scale(' + (1 + (s - 1) * w).toFixed(4) + ')';
                for (var ly = 0; ly < 3; ly++) layerTabs[ly][li].style.transform = kk;
            }
            /* Distorsión de agua sobre vidrio mojado */
            var sc = wet > 0 ? wet * (2 + grow * 7 + Math.min(Math.abs(vx) / 220, 6)) : 0;
            lgDisp.setAttribute('scale', sc.toFixed(2));
            clip.style.filter = wet > 0 ? 'url(#lg-wet)' : 'none';
            var tt = performance.now() / 900;
            lgTurb.setAttribute('baseFrequency', (0.018 + 0.004 * Math.sin(tt)).toFixed(4) + ' ' + (0.045 + 0.008 * Math.cos(tt * 1.3)).toFixed(4));
        }
        function step(t) {
            if (dragging && performance.now() - lastMove > 6000) settle(false);   /* seguro anti-pegado */
            var dt = Math.min((t - last) / 1000 || 0.016, 0.034); last = t;
            var ax = -K * (x - target) - C * vx; vx += ax * dt; x += vx * dt;
            var ag = -300 * (grow - growTarget) - 24 * vg; vg += ag * dt; grow += vg * dt;
            flash *= Math.exp(-dt * 4.5);
            render();
            var still = Math.abs(vx) < 0.5 && Math.abs(x - target) < 0.1 && Math.abs(vg) < 0.01 && Math.abs(grow - growTarget) < 0.002 && flash < 0.01;
            if (still && !dragging) { x = target; grow = growTarget; vx = 0; vg = 0; render(); raf = 0; return; }
            raf = requestAnimationFrame(step);
        }
        function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } }

        /* switchTab() llama a esto para que la gota siga a la pestaña activa */
        window.lgSetTab = function (name) {
            var i = IDS.indexOf(name); if (i < 0) return;
            current = i; if (!dragging) { target = xFor(i); kick(); }
        };

        function updateGlare(e) {
            var r = bar.getBoundingClientRect();
            var px = localX(e), py = (e.clientY - r.top) * (H / (r.height || 1));
            gx = Math.max(0.05, Math.min(0.95, (px - x) / tabW));
            gy = Math.max(0.05, Math.min(0.6, (py - PAD) / lensH));
        }
        /* Gestos: toque (iPhone) con eventos touch, ratón con eventos pointer; siempre se suelta al terminar o ser interrumpido */
        var hit = $('lg-hit') || bar;
        var activeTouch = null;
        function lx(cx) { var r = bar.getBoundingClientRect(); return (cx - r.left) * (W / (r.width || 1)); }
        function glareXY(cx, cy) {
            var r = bar.getBoundingClientRect();
            var px = lx(cx), py = (cy - r.top) * (H / (r.height || 1));
            gx = Math.max(0.05, Math.min(0.95, (px - x) / tabW));
            gy = Math.max(0.05, Math.min(0.6, (py - PAD) / lensH));
        }
        function settle(cx) {
            if (!dragging) return;
            dragging = false; activeId = null; activeTouch = null; growTarget = 0; gx = 0.3; gy = 0.15;
            var px = (typeof cx === 'number' && isFinite(cx)) ? clampX(lx(cx) - tabW / 2) : clampX(target);
            var i = indexAt(px + tabW / 2);
            target = xFor(i);
            if (i !== current && typeof switchTab === 'function') switchTab(IDS[i]);
            current = i; kick();
        }
        function begin(cx, cy) {
            if (dragging) settle();
            dragging = true; lastMove = performance.now();
            growTarget = 1; flash = 1; target = clampX(lx(cx) - tabW / 2);
            glareXY(cx, cy); kick();
        }
        function move(cx, cy) {
            if (!dragging) return;
            lastMove = performance.now();
            target = clampX(lx(cx) - tabW / 2);
            glareXY(cx, cy); kick();
        }
        function findTouch(list) {
            for (var i = 0; i < list.length; i++) if (list[i].identifier === activeTouch) return list[i];
            return null;
        }
        hit.addEventListener('touchstart', function (e) {
            e.preventDefault();
            if (activeTouch !== null && dragging) return;      /* ya hay un dedo activo */
            var t = e.changedTouches[0];
            activeTouch = t.identifier;
            begin(t.clientX, t.clientY);
        }, { passive: false });
        hit.addEventListener('touchmove', function (e) {
            e.preventDefault();
            var t = findTouch(e.changedTouches); if (t) move(t.clientX, t.clientY);
        }, { passive: false });
        hit.addEventListener('touchend', function (e) {
            e.preventDefault();
            var t = findTouch(e.changedTouches); if (t) settle(t.clientX);
        }, { passive: false });
        hit.addEventListener('touchcancel', function (e) {
            if (findTouch(e.changedTouches)) settle();
        });
        /* Ratón / lápiz */
        hit.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'touch') return;
            activeId = e.pointerId;
            try { hit.setPointerCapture(e.pointerId); } catch (err) {}
            begin(e.clientX, e.clientY);
        });
        hit.addEventListener('pointermove', function (e) {
            if (e.pointerType === 'touch' || e.pointerId !== activeId) return;
            if (e.pointerType === 'mouse' && e.buttons === 0) { settle(e.clientX); return; }
            move(e.clientX, e.clientY);
        });
        hit.addEventListener('pointerup', function (e) { if (e.pointerType !== 'touch' && e.pointerId === activeId) settle(e.clientX); });
        hit.addEventListener('pointercancel', function (e) { if (e.pointerType !== 'touch' && e.pointerId === activeId) settle(); });
        hit.addEventListener('lostpointercapture', function (e) { if (e.pointerType !== 'touch' && e.pointerId === activeId) settle(); });
        hit.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        ['blur', 'pagehide'].forEach(function (ev) { window.addEventListener(ev, function () { settle(); }); });
        document.addEventListener('visibilitychange', function () { if (document.hidden) settle(); });

        measure(); render();
        if (window.ResizeObserver) new ResizeObserver(function () { measure(); render(); }).observe(bar);
        window.addEventListener('resize', function () { measure(); render(); });

        /* Controles de la pantalla de Ajustes (se vuelven a enlazar cada vez que se dibuja esa pantalla) */
        function bindSettings() {
            var defs = [['mag', 'gp-lg-mag'], ['dis', 'gp-lg-dis'], ['glr', 'gp-lg-glr'], ['wet', 'gp-lg-wet']];
            function cur(k) { return k === 'mag' ? mag : k === 'dis' ? dis : k === 'glr' ? glr : wet; }
            function put(k, v) { if (k === 'mag') mag = v; else if (k === 'dis') dis = v; else if (k === 'glr') glr = v; else wet = v; }
            function show(k) { var el = $('lg-' + k), o = $('lg-' + k + '-out'); if (el) el.value = cur(k); if (o) o.textContent = cur(k).toFixed(2) + '×'; }
            defs.forEach(function (d) {
                var k = d[0], el = $('lg-' + k); if (!el) return;
                show(k);
                el.addEventListener('input', function (e) {
                    put(k, parseFloat(e.target.value)); sv(d[1], cur(k)); show(k);
                    if (k === 'glr') flash = 1;
                    render(); kick();
                });
            });
            var rs = $('lg-reset');
            if (rs) rs.addEventListener('click', function () {
                defs.forEach(function (d) { put(d[0], DEF[d[0]]); sv(d[1], DEF[d[0]]); show(d[0]); });
                flash = 1; render(); kick();
            });
        }
        window.lgBindSettings = bindSettings;
    })();
    </script>

                                        <span class="text-xs font-semibold ${res.away === 'U. de Chile' ? 'text-blue-400 font-bold' : 'text-gray-300'}">${res.away}</span>

        // ============================================================
        // Vista Competiciones: sub-tabs para Pre-Libertadores,
        // Copa Libertadores, Copa Sudamericana y Supercopa de Chile

        function renderCompeticiones() {
            const comps = getData().competiciones;
            const tabs = [
                { id: 'prelibertadores', label: 'Pre-Libertadores' },
                { id: 'libertadores',    label: 'Copa Libertadores' },
                { id: 'sudamericana',    label: 'Copa Sudamericana' },
                { id: 'supercopa',       label: 'Supercopa Chile' }
            ];
            return `
                <div class="tab-content space-y-4">
                    <div class="glass-panel p-4 rounded-3xl" style="--i:0">
                        <span class="text-xs uppercase tracking-widest text-blue-400 font-semibold">Competiciones 2026</span>

                    <div class="glass-panel p-2 rounded-2xl" style="--i:1">
                        <div class="flex gap-1 overflow-x-auto no-scrollbar">

                                <button onclick="setCompetition('${t.id}')" class="pressable flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${currentCompetition === t.id ? 'bg-uchile-blue text-white border border-uchile-gold shadow-md' : 'text-gray-400 border border-transparent'}">

        function renderCompetitionDetail(comp) {
            const c = getData().competiciones[comp];
            if (!c) return '';
            // Render específico para cada tipo de torneo
            if (comp === 'prelibertadores') return renderPreLibertadores(c);
            if (comp === 'libertadores')    return renderLibertadores(c);
            if (comp === 'sudamericana')    return renderSudamericana(c);
            if (comp === 'supercopa')       return renderSupercopa(c);
            return '';
        }

        function renderTeamChip(name, code, motivo, sizeClass = 'w-9 h-9') {
            return `
                <div class="flex items-center space-x-3 p-2.5 rounded-2xl bg-slate-800/40 border border-white/5">
                    <div class="${sizeClass} flex items-center justify-center shrink-0">
                        <img src="${logoFor(code)}" alt="${name}" class="${sizeClass} object-contain" onerror="this.style.display='none'"/>

                </div>
            `;
        }

        function renderFixtureRow(f) {
            const jugado = f.jugado !== false && f.hScore !== null;
            const score = jugado
                ? `${f.hScore} - ${f.aScore}`
                : 'vs';
            return `
                <div class="pressable flex items-center justify-between p-3 rounded-2xl bg-slate-800/50 border border-white/5">
                    <span class="text-xs text-gray-400 w-24 truncate">${f.fecha}</span>

                        <span class="px-2.5 py-0.5 rounded-lg bg-black/40 font-mono font-bold text-sm border border-white/10 ${jugado ? 'text-emerald-400' : 'text-gray-500'}">${score}</span>
                        <span class="text-xs font-semibold text-gray-300 truncate max-w-[80px]">${f.away}</span>
                        <img src="${logoFor(f.aCode)}" alt="" class="w-5 h-5 object-contain shrink-0" onerror="this.style.display='none'"/>

        function renderPreLibertadores(c) {

        // ============================================================
        // Vista Estadísticas: goleadores, asistencias, vallas invictas
        // ============================================================
        function renderEstadisticas() {
            const e = getData().estadisticas;
            return `
                <div class="tab-content space-y-4">
                    <div class="glass-panel p-4 rounded-3xl" style="--i:0">
                        <span class="text-xs uppercase tracking-widest text-blue-400 font-semibold">Estadísticas</span>
                        <h2 class="text-xl font-bold text-white mt-1">Líderes individuales 2026</h2>
                    </div>

                    ${renderStatTable({
                        title: 'Goleadores',
                        icon: '⚽',
                        headers: ['Pos', 'Jugador', 'Equipo', 'Goles', 'PJ'],
                        rows: (e.goleadores || []).map(g => [
                            `<span class="font-bold ${g.rank <= 3 ? 'text-yellow-300' : 'text-gray-400'}">${g.rank}</span>`,

                            `<span class="flex items-center space-x-1.5"><img src="${logoFor(g.team_code)}" alt="" class="w-4 h-4 object-contain" onerror="this.style.display='none'"/><span class="text-gray-300">${g.team_code || '—'}</span></span>`,
                            `<span class="font-extrabold text-emerald-400">${g.goles}</span>`,

                        ]),
                        idx: 1
                    })}

                    ${renderStatTable({
                        title: 'Asistencias',
                        icon: '🎯',
                        headers: ['Pos', 'Jugador', 'Equipo', 'Asist.', 'PJ'],
                        rows: (e.asistencias || []).map(a => [
                            `<span class="font-bold ${a.rank <= 3 ? 'text-yellow-300' : 'text-gray-400'}">${a.rank}</span>`,

                            `<span class="flex items-center space-x-1.5"><img src="${logoFor(a.team_code)}" alt="" class="w-4 h-4 object-contain" onerror="this.style.display='none'"/><span class="text-gray-300">${a.team_code || '—'}</span></span>`,

                    })}

                    ${(e.vallas_invictas && e.vallas_invictas.length) ? renderStatTable({
                        title: 'Vallas Invictas',
                        icon: '🧤',
                        headers: ['Pos', 'Portero', 'Equipo', 'Vallas', 'PJ'],
                        rows: e.vallas_invictas.map(v => [
                            `<span class="font-bold ${v.rank <= 3 ? 'text-yellow-300' : 'text-gray-400'}">${v.rank}</span>`,
                            `<span class="font-semibold text-white">${v.name}</span>`,
                            `<span class="flex items-center space-x-1.5"><img src="${logoFor(v.team_code)}" alt="" class="w-4 h-4 object-contain" onerror="this.style.display='none'"/><span class="text-gray-300">${v.team_code || '—'}</span></span>`,
                            `<span class="font-extrabold text-purple-400">${v.vallas}</span>`,

                    <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center gap-1 text-[10px] text-gray-500" style="--i:4">

                            <span>Datos: Wikipedia (CC BY-SA) — Liga de Primera 2026</span>
                        </div>
                        ${getData().meta && getData().meta.ultima_actualizacion ? `
                            <span class="text-gray-600">Actualizado: ${new Date(getData().meta.ultima_actualizacion).toLocaleString('es-CL')}</span>

        function renderStatTable({ title, icon, headers, rows, idx }) {
            return `
                <div class="glass-panel rounded-3xl overflow-hidden border border-white/10" style="--i:${idx}">
                    <div class="p-3 border-b border-white/10">

                            <span class="text-base">${icon}</span>
                            ${title}
                        </h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs whitespace-nowrap">
                            <thead>
                                <tr class="bg-slate-900/90 text-gray-400 font-semibold uppercase tracking-wider text-[10px]">
                                    ${headers.map(h => `<th class="py-2.5 px-3">${h}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                                ${rows.map(r => `
                                    <tr class="hover:bg-white/5 transition-colors">
                                        ${r.map(c => `<td class="py-2.5 px-3">${c}</td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>

                </div>

        }

        // ============================================================
        // Cánticos de Los de Abajo: lista clickeable con letra completa.
        // Las letras las agregas tú (se guardan en este teléfono).
        // ============================================================
        const CHANTS_KEY = 'uch-chants';
        let chantOpen = null;      // id del cántico abierto
        let chantEdit = null;      // id en edición, o 'new'
        function loadChants() {
            try {
                const v = JSON.parse(localStorage.getItem(CHANTS_KEY));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return [
                { id: 'c1', title: 'El Himno de la U', text: 'Mágica azul, tu estrella es la luz que guía a la victoria... ¡Universidad de Chile!' },
                { id: 'c2', title: 'Te Sigo a Todas Partes', text: 'No importa en qué cancha jugues, a la U la sigo a todas partes con el corazón...' }
            ];
        }
        function saveChants(list) { try { localStorage.setItem(CHANTS_KEY, JSON.stringify(list)); } catch (e) {} }
        function refreshChants() {
            const box = document.getElementById('chants-box');
            if (box) box.innerHTML = renderChants();
        }
        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function renderChants() {
            const list = loadChants();
            const editing = chantEdit === 'new' ? { id: 'new', title: '', text: '' } : list.find(c => c.id === chantEdit);
            const form = editing ? `
                <div class="p-3 rounded-2xl bg-slate-800/50 border border-blue-500/30 space-y-2">
                    <input id="chant-title" value="${esc(editing.title)}" placeholder="Nombre del cántico" class="w-full px-3 py-2 rounded-xl bg-black/20 border border-white/10 text-sm text-white focus:outline-none" style="user-select:text;-webkit-user-select:text;">
                    <textarea id="chant-text" rows="9" placeholder="Pega aquí la letra completa" class="w-full px-3 py-2 rounded-xl bg-black/20 border border-white/10 text-sm text-white focus:outline-none" style="user-select:text;-webkit-user-select:text;">${esc(editing.text)}</textarea>
                    <div class="flex gap-2">
                        <button type="button" onclick="saveChant('${editing.id}')" class="pressable flex-1 py-2 rounded-xl text-sm font-bold bg-uchile-blue text-white border border-uchile-gold">Guardar</button>
                        <button type="button" onclick="chantEdit=null;refreshChants()" class="pressable flex-1 py-2 rounded-xl text-sm font-bold bg-slate-800/60 border border-white/10 text-gray-300">Cancelar</button>
                    </div>
                </div>` : '';
            return `
                <div class="glass-panel p-4 rounded-3xl space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-bold text-white flex items-center">
                            <svg class="w-4 h-4 mr-2 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"></path></svg>
                            Cánticos de Los de Abajo
                        </h3>
                        <button type="button" onclick="chantEdit='new';chantOpen=null;refreshChants()" class="pressable px-3 py-1.5 rounded-xl text-xs font-bold bg-uchile-blue text-white border border-uchile-gold">+ Agregar</button>
                    </div>
                    ${chantEdit === 'new' ? form : ''}
                    <div class="space-y-2">
                        ${list.map(c => {
                            const open = chantOpen === c.id;
                            return `
                            <div class="rounded-2xl bg-slate-800/50 border ${open ? 'border-blue-500/40' : 'border-white/5'} overflow-hidden">
                                <button type="button" onclick="toggleChant('${c.id}')" class="pressable w-full flex items-center justify-between gap-2 p-3 text-left">
                                    <span class="text-sm font-bold text-blue-400">${esc(c.title)}</span>
                                    <svg class="w-4 h-4 text-gray-400 shrink-0" style="transition:transform .3s;transform:rotate(${open ? 180 : 0}deg)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                ${open ? (chantEdit === c.id ? `<div class="p-3 pt-0">${form}</div>` : `
                                <div class="px-3 pb-3 space-y-3">
                                    <p class="text-sm text-gray-200 leading-relaxed whitespace-pre-line" style="user-select:text;-webkit-user-select:text;">${esc(c.text) || '<span class="text-gray-500 italic">Aún no tiene letra. Toca Editar para pegarla.</span>'}</p>
                                    <div class="flex gap-2">
                                        <button type="button" onclick="chantEdit='${c.id}';refreshChants()" class="pressable flex-1 py-2 rounded-xl text-xs font-bold bg-slate-800/60 border border-white/10 text-gray-200">Editar</button>

        // ============================================================
        // Carga dinámica de datos desde data.json (generado por el
        // scraper Python + GitHub Action). Si fetch falla (ej: abriendo
        // el archivo local con file://) o el JSON tiene estructura
        // incorrecta, usa FALLBACK_DATA.
        // ============================================================
        /*LIVE_START*/
        // ============================================================
        // Datos en vivo (ESPN, gratis y sin clave) + data.json (Wikipedia)
        // Si la fuente en vivo falla, la app sigue con data.json / respaldo.
        // ============================================================
        const ESPN_BASE = 'https://site.api.espn.com/apis/';
        const CODE_NAMES = {};
        (typeof standingsData !== 'undefined' ? standingsData : []).forEach(t => { CODE_NAMES[t.code] = t.name; });
        let liveStatus = { standings: false, matches: false, liveAny: false, at: null, error: '' };

        function normName(n) {
            return String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/'{2,}/g, '').toLowerCase().trim();
        }
        function codeForName(name) {
            const n = normName(name);
            if (!n) return null;
            if (/universidad de concepcion|u\.? de concepcion|univ\.? concepcion/.test(n)) return 'UDC';
            if (/universidad de chile|u\.? de chile/.test(n)) return 'UCH';
            if (/catolica/.test(n)) return 'UC';
            if (/colo.?colo/.test(n)) return 'CC';
            if (/everton/.test(n)) return 'EVE';
            if (/palestino/.test(n)) return 'PAL';
            if (/limache/.test(n)) return 'LIM';
            if (/huachipato/.test(n)) return 'HUA';
            if (/nublense/.test(n)) return 'ÑUB';
            if (/serena/.test(n)) return 'SER';
            if (/coquimbo/.test(n)) return 'COQ';
            if (/concepcion/.test(n)) return 'CON';
            if (/audax/.test(n)) return 'AUD';
            if (/higgins/.test(n)) return 'OHI';
            if (/cobresal/.test(n)) return 'CSL';
            if (/calera/.test(n)) return 'ULC';
            return null;
        }
        function cleanTeamName(raw) {
            const code = codeForName(raw);
            return code && CODE_NAMES[code] ? CODE_NAMES[code] : String(raw || '').replace(/'{2,}/g, '').trim();
        }
        function fmtClock(d) { return d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Santiago' }); }
        function fmtDay(d) { return d.toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'America/Santiago' }).replace(/\./g, ''); }
        function fmtShort(d) { return d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', timeZone: 'America/Santiago' }); }

        async function fetchJSON(url, ms) {
            const ctl = new AbortController();
            const t = setTimeout(() => ctl.abort(), ms || 10000);
            try {
                const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.json();
            } finally { clearTimeout(t); }
        }

        function statVal(entry, names) {
            const st = entry.stats || [];
            for (const nm of names) {
                const f = st.find(x => x.name === nm || x.abbreviation === nm || x.type === nm);
                if (f && f.value !== undefined && f.value !== null && isFinite(Number(f.value))) return Number(f.value);
            }
            return null;
        }

        function parseEspnStandings(json) {
            let entries = null;
            if (json && Array.isArray(json.children)) {
                for (const c of json.children) {
                    if (c.standings && Array.isArray(c.standings.entries) && c.standings.entries.length) { entries = c.standings.entries; break; }
                }
            }
            if (!entries && json && json.standings && Array.isArray(json.standings.entries)) entries = json.standings.entries;
            if (!entries || entries.length < 8) throw new Error('standings inválida');
            const rows = [];
            entries.forEach(e => {
                const code = codeForName(e.team && (e.team.displayName || e.team.name || e.team.shortDisplayName));
                if (!code) return;
                rows.push({
                    code, name: CODE_NAMES[code] || e.team.displayName,
                    pj: statVal(e, ['gamesPlayed', 'GP']), g: statVal(e, ['wins', 'W']), e: statVal(e, ['ties', 'draws', 'D']), p: statVal(e, ['losses', 'L']),
                    gf: statVal(e, ['pointsFor', 'F']), gc: statVal(e, ['pointsAgainst', 'A']),
                    dg: statVal(e, ['pointDifferential', 'GD']), pts: statVal(e, ['points', 'P']), rank: statVal(e, ['rank'])
                });
            });
            if (rows.length < 8 || rows.some(r => r.pts === null || r.pj === null)) throw new Error('standings incompleta');
            rows.forEach(r => { if (r.dg === null && r.gf !== null && r.gc !== null) r.dg = r.gf - r.gc; });
            rows.sort((a, b) => (b.pts - a.pts) || ((b.dg || 0) - (a.dg || 0)) || ((b.gf || 0) - (a.gf || 0)));
            const n = rows.length;
            rows.forEach((r, i) => {
                r.pos = i + 1;
                r.zone = r.pos <= 3 ? 'libertadores' : r.pos <= 7 ? 'sudamericana' : (r.pos >= n - 1 ? 'descenso' : undefined);
                if (r.code === 'UCH') r.isU = true;
                delete r.rank;
            });
            return rows;
        }

        function parseEspnEvents(json) {
            const out = [];
            ((json && json.events) || []).forEach(ev => {
                const comp = ev.competitions && ev.competitions[0];
                if (!comp || !comp.competitors) return;
                const h = comp.competitors.find(c => c.homeAway === 'home');
                const a = comp.competitors.find(c => c.homeAway === 'away');
                if (!h || !a) return;
                const hc = codeForName(h.team && (h.team.displayName || h.team.name));
                const ac = codeForName(a.team && (a.team.displayName || a.team.name));
                if (!hc || !ac) return;
                const st = (ev.status && ev.status.type) || {};
                out.push({
                    date: new Date(ev.date), state: st.state || 'pre', typeName: st.name || '', completed: !!st.completed,
                    detail: st.shortDetail || st.detail || '', clock: (ev.status && ev.status.displayClock) || '',
                    hc, ac, hs: Number(h.score), as: Number(a.score),
                    venue: (comp.venue && comp.venue.fullName) || ''
                });
            });
            return out.filter(m => !isNaN(m.date.getTime())).sort((x, y) => x.date - y.date);
        }

        function buildLiveFromEvents(events, now) {
            const done = events.filter(m => m.state === 'post' && isFinite(m.hs) && isFinite(m.as));
            // Últimos 5 de cada equipo (del más antiguo al más reciente)
            const form = {};
            done.forEach(m => {
                [[m.hc, m.hs, m.as], [m.ac, m.as, m.hs]].forEach(([c, gf, gc]) => {
                    (form[c] = form[c] || []).push(gf > gc ? 'G' : gf < gc ? 'P' : 'E');
                });
            });
            Object.keys(form).forEach(c => { form[c] = form[c].slice(-5); });

            const uDone = done.filter(m => m.hc === 'UCH' || m.ac === 'UCH').slice(-6).reverse();
            const recent = uDone.map(m => {
                const uHome = m.hc === 'UCH';
                const uG = uHome ? m.hs : m.as, oG = uHome ? m.as : m.hs;
                return {
                    home: CODE_NAMES[m.hc] || m.hc, hCode: m.hc, hScore: m.hs,
                    away: CODE_NAMES[m.ac] || m.ac, aCode: m.ac, aScore: m.as,
                    date: fmtShort(m.date), win: uG > oG, draw: uG === oG
                };
            });

            const uAll = events.filter(m => m.hc === 'UCH' || m.ac === 'UCH');
            const liveU = uAll.find(m => m.state === 'in');
            const upcoming = uAll.filter(m => m.state === 'pre' && !/POSTPON|CANCEL|SUSPEND/i.test(m.typeName) && m.date.getTime() > now - 3 * 3600e3);
            const pick = liveU || upcoming[0] || null;
            let next = null;
            if (pick) {
                const live = pick.state === 'in';
                const today = fmtShort(pick.date) === fmtShort(new Date(now));
                next = {
                    home_code: pick.hc, away_code: pick.ac,
                    home_name: CODE_NAMES[pick.hc] || pick.hc, away_name: CODE_NAMES[pick.ac] || pick.ac,
                    time: fmtClock(pick.date), day: fmtDay(pick.date), venue: pick.venue || 'Estadio por confirmar',
                    status: live ? 'EN VIVO' : (today ? 'HOY' : 'PRÓXIMO PARTIDO'),
                    competition: 'Liga de Primera 2026',
                    live, hScore: pick.hs, aScore: pick.as, clock: pick.clock || pick.detail
                };
            }
            return { form, recent, next, liveAny: events.some(m => m.state === 'in') };
        }

        async function loadLive() {
            const y = new Date().getFullYear();
            const res = { standings: null, events: null };
            const errs = [];
            await Promise.all([
                fetchJSON(ESPN_BASE + 'v2/sports/soccer/chi.1/standings').then(j => { res.standings = parseEspnStandings(j); }).catch(e => errs.push('tabla: ' + e.message)),
                fetchJSON(ESPN_BASE + 'site/v2/sports/soccer/chi.1/scoreboard?dates=' + y + '0101-' + y + '1231&limit=500', 15000).then(j => { res.events = parseEspnEvents(j); if (!res.events.length) throw new Error('sin partidos'); }).catch(e => errs.push('partidos: ' + e.message))
            ]);
            return { res, errs };
        }
/*LIVE_END*/

        async function loadData() {
            // 1) data.json (Wikipedia, generado por el Action): copas, goleadores, asistencias
            let base = null;
            try {
                const r = await fetch('data.json?v=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const parsed = await r.json();
                if (!parsed || !parsed.liga || !Array.isArray(parsed.liga.standings) || !parsed.liga.standings.length) throw new Error('Estructura de data.json inválida');
                base = parsed;
            } catch (err) {
                console.warn('[Mi UChile] data.json no disponible:', err.message);
            }
            const merged = base ? JSON.parse(JSON.stringify(base)) : JSON.parse(JSON.stringify(FALLBACK_DATA));
            // Limpieza de nombres/flags de los resultados que vienen de Wikipedia
            if (merged.liga && Array.isArray(merged.liga.recent_results)) {
                merged.liga.recent_results = merged.liga.recent_results.map(r => {
                    const hCode = r.hCode || codeForName(r.home), aCode = r.aCode || codeForName(r.away);
                    const uHome = hCode === 'UCH';
                    const uG = uHome ? r.hScore : r.aScore, oG = uHome ? r.aScore : r.hScore;
                    return Object.assign({}, r, {
                        home: cleanTeamName(r.home), away: cleanTeamName(r.away), hCode, aCode,
                        win: r.win !== undefined ? r.win : uG > oG, draw: r.draw !== undefined ? r.draw : uG === oG
                    });
                });
            }
            // 2) ESPN en vivo: tabla, resultados, últimos 5 y próximo partido
            let errs = [];
            try {
                const { res, errs: e2 } = await loadLive();
                errs = e2;
                liveStatus.standings = !!res.standings;
                liveStatus.matches = !!res.events;
                if (res.standings) merged.liga.standings = res.standings;
                if (res.events) {
                    const b = buildLiveFromEvents(res.events, Date.now());
                    merged.liga.standings.forEach(t => { if (b.form[t.code]) t.last5 = b.form[t.code]; });
                    if (b.recent.length) merged.liga.recent_results = b.recent;
                    merged.liga.next_match = b.next;
                    liveStatus.liveAny = b.liveAny;
                } else { liveStatus.liveAny = false; }
            } catch (err) {
                errs.push(err.message);
                liveStatus.standings = false; liveStatus.matches = false; liveStatus.liveAny = false;
            }
            liveStatus.error = errs.join(' · ');
            liveStatus.at = new Date();
            if (liveStatus.standings || liveStatus.matches) {
                merged.meta = Object.assign({}, merged.meta || {}, { fuente: 'ESPN (en vivo) + Wikipedia' });
            }
            appData = merged;
            console.log('[Mi UChile] datos', { liveStatus, jsonOk: !!base });
        }

        // ---------- Refresco automático ----------
        let refreshing = false, lastRefresh = Date.now();
        function statusText() {
            const t = liveStatus.at ? fmtClock(liveStatus.at) : '—';
            if (liveStatus.standings && liveStatus.matches) return (liveStatus.liveAny ? '🔴 Partido en juego · ' : '') + 'En vivo (ESPN) · actualizado ' + t;
            if (liveStatus.standings || liveStatus.matches) return 'En vivo parcial (ESPN) · actualizado ' + t;
            return 'Sin conexión con la fuente en vivo · mostrando datos guardados';
        }
        function updateLiveStatus() {
            document.querySelectorAll('.live-status').forEach(el => { el.textContent = statusText(); });
            const d = document.getElementById('live-detail');
            if (d) {
                const m = getData().meta || {};
                const w = m.ultima_actualizacion ? new Date(m.ultima_actualizacion).toLocaleString('es-CL') : '—';
                d.textContent = 'Goleadores y asistencias (Wikipedia): ' + w + (liveStatus.error ? ' · Aviso: ' + liveStatus.error : '');
            }
        }
        function rerenderCurrent() {
            const content = document.getElementById('app-content');
            if (!content) return;
            if (currentTab === 'tabla') content.innerHTML = renderStandings();
            else if (currentTab === 'partidos') content.innerHTML = renderMatches();
            else if (currentTab === 'club' && currentClubSection === 'estadisticas') { const c = document.getElementById('club-content'); if (c) c.innerHTML = renderClubSection('estadisticas'); }
            else return;
            content.querySelectorAll('.tab-content, .tab-content > *').forEach(el => { el.style.animation = 'none'; });
        }
        async function refreshData(force) {
            if (refreshing) return;
            refreshing = true;
            const btn = document.getElementById('refresh-btn'); if (btn) btn.textContent = 'Actualizando…';
            try {
                const sig = () => JSON.stringify([getData().liga, getData().estadisticas]);
                const before = sig();
                await loadData();
                if (sig() !== before) rerenderCurrent();
            } catch (e) { console.warn('[Mi UChile] refresh falló', e); }
            finally {
                refreshing = false; lastRefresh = Date.now();
                if (btn) btn.textContent = 'Actualizar ahora';
                updateLiveStatus();
            }
        }
        function startAutoRefresh() {
            setInterval(() => {
                if (document.hidden) return;
                const every = liveStatus.liveAny ? 30e3 : 5 * 60e3;
                if (Date.now() - lastRefresh >= every) refreshData();
            }, 15e3);
            document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastRefresh > 45e3) refreshData(); });
            window.addEventListener('online', () => refreshData());
        }

        // ============================================================
        // Inicialización — usa DOMContentLoaded (no espera a `load`)
        // para no depender de que el CDN de Motion cargue. Si el
        // documento ya está parsed, ejecuta inmediatamente.
        // ============================================================
        async function initApp() {
            try {
                await loadData();
                switchTab('tabla');
                startAutoRefresh();
            } catch (err) {
                console.error('[Mi UChile] Error al inicializar:', err);
                // Mostrar mensaje de error visible en lugar de pantalla en blanco
                document.getElementById('app-content').innerHTML = `
                    <div class="glass-panel p-6 rounded-3xl text-center space-y-3">
                        <div class="text-red-400 text-4xl">⚠</div>
                        <h2 class="text-lg font-bold text-white">No se pudo cargar la app</h2>
                        <p class="text-xs text-gray-400">Error: ${err.message || 'desconocido'}</p>
                        <p class="text-xs text-gray-500 mt-4">Abre la consola (F12) para más detalles, o recarga la página.</p>
                        <button onclick="location.reload()" class="pressable mt-4 px-4 py-2 rounded-xl bg-uchile-blue text-white text-sm font-bold border border-uchile-gold">Recargar</button>
                    </div>
                `;
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            // El DOM ya está listo (script está al final del body)
            initApp();
        }
    </script>
</body>
</html>
